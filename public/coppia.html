<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Del Piccolo Diavolo · Accoppiamento</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#faf8f5;color:#4a3f35;line-height:1.6;font-size:.95rem}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;color:#5c4a3a}
.nav{display:flex;align-items:center;gap:.6rem;padding:.6rem 1.5rem;background:#faf8f5;border-bottom:1px solid rgba(139,115,85,.1)}
.nav img{width:40px;height:40px;border-radius:50%;border:2px solid #8b5a2b;object-fit:cover}.nav b{font-family:Georgia,serif;color:#5c4a3a}
.nav .lg{margin-left:auto;display:flex;gap:6px}.nav .lg a{font-size:.7rem;font-weight:600;color:#8b5a2b;border:1px solid #8b5a2b;border-radius:4px;padding:.3rem .5rem;text-decoration:none}
.wrap{max-width:780px;margin:0 auto;padding:2rem 1.25rem 3rem}
.label{font-size:.6rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#5c4a3a;margin:0 0 .35rem}
.ttl{font-size:1.5rem;margin:0 0 1rem}.lead{text-align:center;margin:0 0 1.5rem}
.lc{background:#fff;border:1px solid rgba(139,115,85,.1);border-radius:12px;padding:1.25rem 1.25rem 1rem;margin:0 0 1.5rem}
.lc-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:.8rem;border-bottom:1px solid rgba(139,115,85,.12);margin-bottom:1rem}
.lc-h h2{font-size:1.15rem;margin:0}.badge{font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border-radius:4px;padding:.35rem .6rem;background:#f5ebe0;color:#8b5a2b;white-space:nowrap}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:1rem;align-items:start}.x{color:#8b5a2b;font-weight:700;padding-top:5rem}
.dog h3{font-family:system-ui,sans-serif;font-size:.9rem;font-weight:600;text-align:center;margin:0 0 .6rem;color:#5c4a3a}
.ph{width:100%;max-width:200px;aspect-ratio:3/4;margin:0 auto .7rem;border-radius:8px;background:linear-gradient(135deg,#e8dccd,#d9cbb9);display:grid;place-items:center;color:#8a7d70;font-size:.8rem}
.dog ul{list-style:none;font-size:.8rem}.dog li{position:relative;padding-left:1rem;margin:.15rem 0}.dog li::before{content:"•";position:absolute;left:0;color:#8b5a2b}
.dog .par{font-style:italic;font-size:.78rem;color:#6b5d52;text-align:center;margin:.5rem 0 .2rem}.dog .sb{text-align:center;font-size:.78rem}
a{color:#8b5a2b;text-decoration:underline;text-underline-offset:2px}
.coi{margin:1.2rem 0 0;padding-top:1rem;border-top:1px solid rgba(139,115,85,.12)}
.coi-r{display:flex;align-items:baseline;flex-wrap:wrap;gap:.6rem}.big{font-family:Georgia,serif;font-size:2.6rem;line-height:1;color:#5c4a3a}.big small{font-size:1.2rem}
.hi{font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border-radius:4px;padding:.35rem .6rem;background:#fde2e4;color:#b42318}
.sc{position:relative;height:8px;border-radius:4px;margin:1.3rem 0 .35rem;background:linear-gradient(90deg,#d9e6f2 0 50%,#dcebd9 50% 75%,#f2d6d2 75%)}.sc i{position:absolute;top:-6px;width:3px;height:20px;border-radius:2px;background:#5c4a3a}.sc i.g{background:#b8a898}
.tk{display:flex;justify-content:space-between;font-size:.7rem;color:#8a7d70}.meta{font-size:.82rem;color:#6b5d52;margin:.5rem 0 0}
.callout{background:#f5ebe0;border:1px solid rgba(139,115,85,.25);border-radius:12px;padding:1rem 1.15rem;margin:1rem 0;font-size:.9rem}
.sub{font-family:Georgia,serif;font-size:1rem;color:#5c4a3a;margin:1.2rem 0 .4rem}
.r{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:.6rem 0;border-bottom:1px solid rgba(139,115,85,.1);font-size:.85rem}.r:last-of-type{border:0}.r small{color:#8a7d70;font-size:.76rem}
.r .b{grid-column:1/-1;height:5px;border-radius:3px;background:#f0e6da}.r .b div{height:100%;border-radius:3px;background:#8b5a2b}
.foot{margin-top:1rem;padding-top:.8rem;border-top:1px solid rgba(139,115,85,.12);font-size:.85rem;font-weight:600;color:#5c4a3a}
.ft{font-size:.8rem;color:#8a7d70;text-align:center;margin-top:2rem}
@media(max-width:600px){.pair{grid-template-columns:1fr}.x{padding:0;text-align:center}.big{font-size:2.2rem}}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:8px}.ph.no{background:linear-gradient(135deg,#efe6da,#e2d5c4)}.empty{padding:60px 0;text-align:center;color:#8a7d70}.trio{font-size:.82rem;color:#6b5d52;margin:.35rem 0 0}.lgB{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;background:#f5ebe0;border-bottom:1px solid rgba(139,115,85,.2);padding:10px 12px;font-size:.88rem}
.lgB .t{color:#6b5d52;font-weight:600}.lgB a{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;background:#fff;border:1.5px solid #e2d5c4;color:#5c4a3a;font-weight:700;text-decoration:none}
.lgB a.on{border-color:#8b5a2b;box-shadow:0 0 0 2px rgba(139,90,43,.2)}.fl{width:22px;height:15px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.12);flex:none;display:block}
</style></head><body>
<!-- Pagina condivisa di una coppia (link segreto da Accoppiamenti). Stile delle schede delle cucciolate del sito (scelta di
     Paolo, 07/10/2026). Niente regole ENCI. Lingue: ?l=en, ?l=de (di base italiano). -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="fl-it" viewBox="0 0 3 2"><rect width="1" height="2" fill="#009246"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#ce2b37"/></symbol>
<symbol id="fl-en" viewBox="0 0 60 30"><clipPath id="flc"><path d="M0,0 v30 h60 v-30 z"/></clipPath><clipPath id="fld"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><g clip-path="url(#flc)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#fld)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></symbol>
<symbol id="fl-de" viewBox="0 0 5 3"><rect width="5" height="1" fill="#000"/><rect y="1" width="5" height="1" fill="#DD0000"/><rect y="2" width="5" height="1" fill="#FFCE00"/></symbol></defs></svg>
<div class="nav"><img src="https://delpiccolodiavolo.it/images/logo.webp" alt=""><b>Del Piccolo Diavolo</b></div>
<div class="lgB" id="lg"></div>
<div class="wrap" id="app"><p class="empty">…</p></div>
<script>
const LQ=new URLSearchParams(location.search).get("l"),L=LQ==="en"||LQ==="de"?LQ:"it",T=(i,e,d)=>L==="en"?e:L==="de"?(d||e):i;
const N=x=>x==null||x===""?"—":(L==="en"?String(x).replace(",","."):String(x).replace(".",",")),pc=v=>v==null||v===""?NaN:parseFloat(String(v).replace(",","."));
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tok=location.pathname.split("/").filter(Boolean).pop();
document.documentElement.lang=L;
document.getElementById("lg").innerHTML=`<span class="t">${T("Leggi in:","Read in:","Lesen auf:")}</span>`+[["it","Italiano"],["en","English"],["de","Deutsch"]].map(x=>`<a href="?l=${x[0]}" lang="${x[0]}"${x[0]===L?' class="on" aria-current="true"':""}><svg class="fl" aria-hidden="true"><use href="#fl-${x[0]}"/></svg>${x[1]}</a>`).join("");
const ord=n=>L==="en"?n+(n==1?"st":n==2?"nd":n==3?"rd":"th"):L==="de"?n+".":n+"ª";
function page(d){const r=d.read||{},P=d.pub||null,v=pc(d.coi),pos=x=>Math.max(1,Math.min(99,x/12*100));
  const tm=d.tmUrl||(d.sire.sbt&&d.dam.sbt?`https://sbtpedigree.com/pedigree?SIRE=${encodeURIComponent(d.sire.sbt)}&DAM=${encodeURIComponent(d.dam.sbt)}&generation=8`:"");
  const band=isNaN(v)?null:v<6?["lo",T("sotto la fascia 6–9%","below the 6–9% range","unter dem Bereich 6–9 %")]:v<=9?["ok",T("nella fascia 6–9%","within the 6–9% range","im Bereich 6–9 %")]:["hi",T("sopra la fascia 6–9%","above the 6–9% range","über dem Bereich 6–9 %")];
  const bc={lo:"background:#e3ecf8;color:#1f4e8c",ok:"background:#e1f2e5;color:#1d6b33",hi:""};
  const pick=(x,k)=>x[k+(L==="it"?"":"_"+L)]||x[k];
  const split=s=>String(s||"").split(" · ").map(x=>x.trim()).filter(Boolean);
  const dog=(x,who)=>`<div class="dog"><h3>${esc(x.name)}</h3><div class="ph${x.photo?"":" no"}">${x.photo?`<img src="/api/public/coppia/${encodeURIComponent(tok)}/f/${who}" alt="${esc(x.name)}" loading="lazy">`:""}</div>
    <ul>${split(pick(x,"tests")).concat(split(pick(x,"titles"))).map(t=>`<li>${esc(t)}</li>`).join("")}</ul>${x.parents?`<p class="par">${esc(x.parents)}</p>`:""}${x.sbt?`<p class="sb"><a href="https://sbtpedigree.com/dog_details?dogs_id=${encodeURIComponent(x.sbt)}" target="_blank" rel="noopener">SBTPedigree</a></p>`:""}</div>`;
  // su chi cade: dati del test mating SBT se letti, se no il calcolo del gestionale
  const B=(r.blood||[]).length?r.blood.map(t=>({n:t.name,s:`${T("compare","appears","kommt")} ${t.n||1} ${T(t.n==1?"volta":"volte",t.n==1?"time":"times",t.n==1?"Mal vor":"Mal vor")}${t.gens?" · "+T("generazioni","generations","Generationen")+" "+t.gens:""}`,p:+t.pct||0,sh:null})):
    (P&&P.anc||[]).map(a=>({n:a.n,s:`${T("Lato padre","Sire's side","Vaterseite")}: ${(a.pg||[]).map(ord).join(", ")||"—"} ${T("gen.","gen.","Gen.")} · ${T("Lato madre","Dam's side","Mutterseite")}: ${(a.mg||[]).map(ord).join(", ")||"—"} ${T("gen.","gen.","Gen.")}`,p:a.p,sh:a.sh,ap:P.approx}));
  const mx=Math.max(1,...B.map(b=>b.sh!=null?b.sh:b.p));
  const top=B[0];
  const why=!isNaN(v)&&v>9?`<div class="callout">${T(`Il COI di questa coppia, ${N(Math.round(v*100)/100)}% su SBTPedigree, è sopra la fascia che usiamo di solito (6-9%). Lo mostriamo lo stesso, perché i numeri si pubblicano anche quando non sono quelli ideali.`,
    `This pairing's COI, ${N(Math.round(v*100)/100)}% on SBTPedigree, is above the range we usually aim for (6-9%). We show it anyway, because figures should be published even when they are not ideal.`,
    `Der COI dieser Verpaarung, ${N(Math.round(v*100)/100)} % auf SBTPedigree, liegt über dem Bereich, den wir normalerweise anstreben (6-9 %). Wir zeigen ihn trotzdem, denn Zahlen gehören auch dann veröffentlicht, wenn sie nicht ideal sind.`)}${top&&top.sh!=null?" "+(top.sh>=60?T(`Quasi due terzi della parentela cadono su un solo antenato, ${esc(top.n)}.`,`Almost two thirds of the relationship comes from a single ancestor, ${esc(top.n)}.`,`Fast zwei Drittel der Verwandtschaft gehen auf einen einzigen Vorfahren zurück, ${esc(top.n)}.`):top.sh>=45?T(`Circa metà della parentela cade su un solo antenato, ${esc(top.n)}.`,`About half of the relationship comes from a single ancestor, ${esc(top.n)}.`,`Etwa die Hälfte der Verwandtschaft geht auf einen einzigen Vorfahren zurück, ${esc(top.n)}.`):T(`La parte più grande della parentela cade su ${esc(top.n)}.`,`The largest share of the relationship comes from ${esc(top.n)}.`,`Der größte Teil der Verwandtschaft geht auf ${esc(top.n)} zurück.`)):""}</div>`:"";
  const F=Object.assign({name:"Del Piccolo Diavolo",person:"Paolo Boldrini",cityProv:"Ostellato (FE)",phoneIntl:"+39 392 463 5584",site:"delpiccolodiavolo.it"},d.farm||{});
  document.title=`${d.dam.name} × ${d.sire.name} · ${F.name}`;try{const n=document.querySelector(".nav b");if(n)n.textContent=F.name;const im=document.querySelector(".nav img");if(im){im.onerror=()=>im.remove();if(F.site)im.src="https://"+F.site+"/images/logo.webp";else im.remove()}}catch(e){}
  return `<p class="label">${T("Accoppiamenti","Matings","Verpaarungen")}</p><h1 class="ttl">${T("Accoppiamento in valutazione","Mating under evaluation","Verpaarung in Prüfung")}</h1>
  <p class="lead">${T("Prima di ogni accoppiamento studiamo i pedigree, il coefficiente di consanguineità e i test genetici dei due cani. Qui sotto i numeri di questa coppia, così come li vediamo noi.","Before every mating we study the pedigrees, the inbreeding coefficient and the genetic tests of both dogs. Below are the figures for this pairing, exactly as we see them.","Vor jeder Verpaarung prüfen wir die Ahnentafeln, den Inzuchtkoeffizienten und die Gentests beider Hunde. Unten die Zahlen dieser Verpaarung, so wie wir sie sehen.")}</p>
  <div class="lc"><div class="lc-h"><h2>${esc(d.dam.name)} × ${esc(d.sire.name)}</h2><span class="badge">${T("In valutazione","Under evaluation","In Prüfung")}</span></div>
  <div class="pair">${dog(d.dam,"dam")}<div class="x">×</div>${dog(d.sire,"sire")}</div>
  <div class="coi"><p class="label">${T("Coefficiente di consanguineità","Inbreeding coefficient","Inzuchtkoeffizient")}</p>
  <div class="coi-r"><span class="big">${isNaN(v)?"—":N(Math.round(v*100)/100)}<small>%</small></span>${band?`<span class="hi" style="${bc[band[0]]}">${band[1]}</span>`:""}</div>
  <p class="meta">${T("COI su 8 generazioni · SBTPedigree","8-generation COI · SBTPedigree","COI über 8 Generationen · SBTPedigree")}</p>
  ${isNaN(v)?"":`<div class="sc"><i style="left:${pos(v)}%"></i>${P&&P.coiG!=null?`<i class="g" style="left:${pos(P.coiG)}%"></i>`:""}</div><div class="tk"><span>0%</span><span>3%</span><span>6%</span><span>9%</span><span>12%+</span></div>`}
  ${r.coi3!=null||r.coi5!=null?`<p class="trio">3 ${T("gen.","gen.","Gen.")}: <b>${N(r.coi3)}%</b> · 5 ${T("gen.","gen.","Gen.")}: <b>${N(r.coi5)}%</b> · 8 ${T("gen.","gen.","Gen.")}: <b>${N(Math.round(v*100)/100)}%</b></p>`:""}
  ${P&&P.coiG!=null?`<p class="meta">${T("Calcolo del gestionale dell'allevamento","Kennel software calculation","Berechnung unserer Zuchtverwaltung")}: <b>${N(P.coiG)}%</b>${P.tot?` · ${T("albero completo al","pedigree complete at","Ahnentafel vollständig zu")} ${Math.round(P.known/P.tot*100)}% (${P.known} ${T("antenati su","ancestors out of","Vorfahren von")} ${P.tot})`:""}</p>`:""}</div>
  ${""/* spiegazione del COI alto tolta su richiesta di Paolo (07/10/2026) */}
  ${B.length?`<p class="sub">${T("Su chi cade la consanguineità","Where the inbreeding comes from","Worauf die Inzucht zurückgeht")}</p>${B.map(b=>`<div class="r"><span><b>${esc(b.n)}</b><br><small>${esc(b.s)}</small></span><span style="text-align:right"><b>${b.ap?"≈ ":""}${N(b.p)}%</b>${b.sh!=null?`<br><small>${b.sh}% ${T("del totale","of the total","vom Gesamtwert")}</small>`:""}</span><div class="b"><div style="width:${Math.min(100,(b.sh!=null?b.sh:b.p)/mx*100)}%"></div></div></div>`).join("")}${P&&P.ancMore&&!(r.blood||[]).length?`<p class="meta">${T(`Altri ${P.ancMore} antenati in comune, con peso minore.`,`${P.ancMore} more common ancestors, with less weight.`,`${P.ancMore} weitere gemeinsame Vorfahren mit geringerem Gewicht.`)}</p>`:""}`:""}
  ${P&&P.due?`<p class="meta" style="margin-top:1rem">${T("Parto previsto, se la monta avviene come ipotizzato","Expected whelping, if the mating takes place as planned","Voraussichtlicher Wurftermin, wenn die Deckung wie geplant erfolgt")}: <b>${esc(P.due.split("-").reverse().join("/"))}</b></p>`:""}
  ${tm?`<p class="foot">${T("Test mating","Test mating","Testverpaarung")}: <a href="${esc(tm)}" target="_blank" rel="noopener">${T("vedi su SBTPedigree","see on SBTPedigree","auf SBTPedigree ansehen")}</a></p>`:""}</div>
  <p class="ft">${esc(F.person)} · ${T("Allevamento","Kennel","Zucht")} ${esc(F.name)}, ${esc(F.cityProv)} · ${esc(F.phoneIntl)}</p>`}
(window.COPPIA?Promise.resolve(window.COPPIA):fetch("/api/public/coppia/"+encodeURIComponent(tok)).then(r=>r.ok?r.json():Promise.reject()))
 .then(d=>{document.getElementById("app").innerHTML=page(d)}).catch(()=>{document.getElementById("app").innerHTML=`<p class="empty">${T("Link non valido o non più attivo.","This link is not valid or no longer active.","Dieser Link ist ungültig oder nicht mehr aktiv.")}</p>`});
</script></body></html>
