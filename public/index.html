<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Del Piccolo Diavolo · Gestionale</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEF1;--paper:#FFFFFF;--ink:#1C2230;--muted:#5C6472;--line:#D6DAE0;
  --accent:#8C2B23;--accent-soft:#F4E3E1;--ok:#2F6B3F;--ok-soft:#E1EEE4;--warn:#9A5B12;--warn-soft:#F6EAD8;
  --serif:"Young Serif",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171D;--paper:#1D2129;--ink:#E7E9ED;--muted:#9AA1AD;--line:#2F3541;
  --accent:#E07468;--accent-soft:#3A2220;--ok:#7CC48E;--ok-soft:#1E3326;--warn:#E3A55A;--warn-soft:#3A2C18;}}
:root[data-theme="dark"]{
  --bg:#14171D;--paper:#1D2129;--ink:#E7E9ED;--muted:#9AA1AD;--line:#2F3541;
  --accent:#E07468;--accent-soft:#3A2220;--ok:#7CC48E;--ok-soft:#1E3326;--warn:#E3A55A;--warn-soft:#3A2C18;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
main{min-width:0}
nav.side{background:var(--paper);border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh}
.brand{font-family:var(--serif);font-size:1.35rem;line-height:1.15;margin:0 0 4px}
.brand-sub{color:var(--muted);font-size:.85rem;margin:0 0 28px}
.navbtn{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;padding:10px 12px;border-radius:8px;text-align:left;color:var(--muted);font-weight:500}
.navbtn[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.navbtn svg{width:20px;height:20px;flex:none}
main{padding:28px clamp(16px,4vw,48px) 100px;max-width:1100px;width:100%}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(1.7rem,4vw,2.3rem);line-height:1.1;margin:0 0 6px}
h2{font-family:var(--serif);font-weight:400;font-size:1.3rem;margin:32px 0 12px}
.lead{color:var(--muted);margin:0 0 20px}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px;align-items:center}
.search{flex:1 1 220px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:.9rem;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.btn{border:0;background:var(--ink);color:var(--paper);border-radius:8px;padding:10px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:.9rem}

.list{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--bg)}
.row{align-items:center}
.pups{margin-top:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pups summary{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;list-style:none;font-weight:600}
.pups summary::-webkit-details-marker{display:none}
.pups summary span:first-child::after{content:"▾";display:inline-block;margin-left:8px;color:var(--muted);transition:transform .15s}
.pups[open] summary span:first-child::after{transform:rotate(180deg)}
.pups[open] summary{border-bottom:1px solid var(--line)}
.pups .list{border:0;border-radius:0}
.lnk{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:500;text-align:left;text-decoration:underline;text-underline-offset:2px}
.thumb{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--bg);flex:none}
.thumb.ph{display:grid;place-items:center;color:var(--muted);font-family:var(--serif)}
.rowwrap{display:flex;gap:12px;align-items:center;min-width:0}
.hero-photo{width:100%;max-width:420px;max-height:460px;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block;margin:0 0 16px}
.pcell img{width:100%;height:120px;object-fit:contain;background:var(--bg);border-radius:4px;margin:0 0 5px;display:block}
.photo-edit{display:flex;gap:12px;align-items:center}
.photo-edit img{width:72px;height:72px;object-fit:cover;border-radius:8px}
.row-name{font-family:var(--serif);font-size:1.08rem}
.row-meta{color:var(--muted);font-size:.88rem;grid-column:1}
.badge{font-size:.78rem;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--muted);align-self:start;white-space:nowrap}
.badge.f{background:var(--accent-soft);color:var(--accent)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}

.back{background:none;border:0;color:var(--muted);padding:0;margin:0 0 14px;font-weight:500}
.nick{color:var(--muted);font-size:1rem;margin:0 0 18px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 8px}
.fact{background:var(--paper);padding:12px 14px}
.fact dt{color:var(--muted);font-size:.8rem}
.fact dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.empty{color:var(--muted);font-style:italic;font-weight:400}
.note{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;white-space:pre-wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0}

.hero{display:grid;grid-template-columns:1fr minmax(160px,38%);gap:0;background:var(--ink);color:#fff;border-radius:16px;overflow:hidden;margin:0 0 16px;min-height:220px}
.hero-t{padding:26px 24px;display:flex;flex-direction:column;justify-content:flex-end}
.hero-k{margin:0;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.hero-h{font-family:var(--serif);font-weight:400;font-size:clamp(1.9rem,5vw,2.8rem);line-height:1.05;margin:6px 0 6px;color:#fff}
.hero-s{margin:0;opacity:.75}
.hero-p{position:relative}.hero-p img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
@media (max-width:560px){.hero{grid-template-columns:1fr;min-height:0}.hero-p{height:260px;order:-1}.hero-t{padding:18px}}
.lab{margin:0 0 4px;font-weight:600;font-size:.9rem}
.sx{display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--muted)}
.sx:focus-within{border-color:var(--ink)}
.sx input{flex:1;border:0;outline:0;background:none;padding:10px 0;font:inherit;color:var(--ink);min-width:0}
.fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.25);cursor:pointer;z-index:9}
.fab svg{width:26px;height:26px}
.fabl{position:absolute;right:66px;background:var(--ink);color:var(--paper);font-size:.85rem;padding:4px 10px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.fab:hover .fabl,.fab:focus-visible .fabl{opacity:1}
@media (max-width:760px){.fab{bottom:calc(84px + env(safe-area-inset-bottom,0px));right:16px}}
.row-par{display:block;font-size:.86rem;margin-top:2px;color:var(--ink)}
.row-par b{color:var(--muted);font-weight:400;margin:0 2px}
.row-par i,.row-par2 i{color:var(--muted)}
.row-par2{display:flex;flex-direction:column;gap:1px;margin-top:4px;font-size:.84rem}
.row-par2 span{padding-left:7px;border-left:3px solid var(--ink)}
.row-par2 .pf{border-left-color:var(--accent)}
.plink{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.plink:hover{color:var(--accent);text-decoration-color:currentColor}
.od-wrap{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;margin-top:4px}
.od-n{display:block;font-size:.92rem;color:var(--ink)}
.cb{position:relative}
.cbi{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font:inherit;font-size:1rem;color:var(--ink)}
.cbi:focus{outline:0;border-color:var(--accent)}
.cb .menu{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.15);max-height:280px;overflow:auto;z-index:30;display:none}
.cb .menu.open{display:block}
.cb .menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;font:inherit;font-size:.95rem;color:var(--ink);cursor:pointer}
.cb .menu button small{color:var(--muted);margin-left:6px}
.cb .menu button:hover,.cb .menu button.act{background:var(--bg)}
.cb .menu .add{border-top:1px solid var(--line);color:var(--accent);font-weight:600}
.cb .menu .clr{color:var(--muted);font-size:.85rem}
.cb-none{margin:0;padding:9px 12px;color:var(--muted);font-size:.9rem}
.tag{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:999px;background:var(--bg);color:var(--muted);margin-left:6px;vertical-align:1px}
.fnote{background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:.9rem;margin:-4px 0 14px}
.pmiss-box{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.pmiss{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.pmiss:first-of-type{border-top:0}
.pedf{min-width:880px}
.pedf .pcell.slot{background:var(--bg);border-style:dashed}
.pedf .sl{display:block;font-size:.75rem;color:var(--muted);margin:0 0 4px}
.pedf .cbi{padding:7px 9px;font-size:.9rem}
.sheet:has(.pedf){width:min(1000px,100%)}
.anc-h{font-family:var(--serif);font-weight:400;font-size:1.2rem;margin:18px 0 2px}.anc-h span{font-family:var(--sans);font-size:.85rem;color:var(--muted)}
.anc-list{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.anc-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.anc-row:first-child{border-top:0}
.anc-n{font-family:var(--serif);font-size:1.02rem;text-align:left}
.anc-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.anc-r{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.anc-c{font-family:var(--serif);font-size:1.35rem;line-height:1}
.anc-r a{font-size:.82rem;color:var(--accent);white-space:nowrap}
.hnext{background:var(--warn-soft);border-radius:10px;padding:10px 14px;margin:0 0 12px}
.hsec{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.hhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 6px}.hhead h3{margin:0;font-size:1rem}
.hrow{display:grid;grid-template-columns:100px 1fr auto;gap:10px;align-items:start;padding:7px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}.hd{color:var(--muted);font-size:.9rem}
.hrow small{display:block;color:var(--muted);margin-top:2px}.hrow small a{color:var(--accent)}
.hx{border:0;background:none;color:var(--muted);font-size:1.2rem;line-height:1;cursor:pointer;padding:0 4px}
.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.pv-ex{border:2px dashed var(--warn);background:var(--warn-soft);border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:.9rem}
.dna{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.dna-ok{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:8px 12px;margin:0 0 10px;font-weight:600;font-size:.92rem}
.dna-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.dna-c{display:flex;justify-content:space-between;gap:8px;background:var(--bg);border-radius:6px;padding:5px 9px;font-size:.85rem}
.dna-c span{color:var(--muted)}.dna-c b{font-weight:600;font-variant-numeric:tabular-nums}
.dna-pdf{color:var(--accent);font-weight:600}
.coi-empty .coi-num{color:var(--muted)}
.sbt-in input{width:90px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;margin-left:4px}
.coi2{display:flex;flex-direction:column;gap:2px;margin:8px 0 0;padding:8px 12px;border-left:3px solid var(--line);font-size:.92rem}
.pups,.pups *,.pups *::before,.pups *::after{box-sizing:border-box}
.rowwrap>span:last-child{min-width:0}
.row-name,.row-meta,.row-par2 span,.od-n{overflow-wrap:anywhere}
.row .badge{justify-self:end;max-width:100%}
.pups summary{flex-wrap:wrap}.pups summary span{min-width:0}
.hfab{position:fixed;right:90px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.25);cursor:pointer;z-index:9}
.hfab svg{width:24px;height:24px}.hfab .fabl{right:66px}
.hfab:hover .fabl,.hfab:focus-visible .fabl{opacity:1}
@media (max-width:760px){.hfab{bottom:calc(84px + env(safe-area-inset-bottom,0px));right:84px}}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:.92rem;opacity:0;pointer-events:none;transition:all .2s;z-index:40}
#toast.show{opacity:1;transform:translateX(-50%)}
.pd-h{margin:12px 0 6px;font-size:.92rem;color:var(--muted)}.pd-h strong{color:var(--ink)}
.banner .bn-act{display:inline-flex;gap:6px;flex-wrap:wrap;margin-left:6px;vertical-align:middle}
.banner .btn.small{padding:3px 10px;font-size:.82rem}
.fact-e{all:unset;display:flex;flex-direction:column;justify-content:flex-start;cursor:pointer;box-sizing:border-box;background:var(--paper);padding:12px 14px;text-align:left}
.fact-e .dt{display:block;color:var(--muted);font-size:.8rem}.fact-e .dd{display:block;margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.fact-e:hover{background:var(--bg)}.fact-e .pen{margin-left:6px;opacity:.35;vertical-align:-2px}
.fact-e:hover .pen{opacity:1;color:var(--accent)}
.ins{color:var(--accent);font-weight:600}
.editbox{background:var(--paper);border:2px solid var(--accent);border-radius:12px;padding:14px;margin:0 0 8px}
.edit-h{margin:0 0 12px;font-size:.9rem;color:var(--muted)}
.editbox .f>span{font-size:.88rem;color:var(--muted)}
.savebar{position:sticky;bottom:0;background:var(--paper);padding:10px 0 4px;margin:12px 0 0}
.btn.save{background:var(--accent);color:#fff;font-size:1.05rem;padding:12px 28px}
.facts .ins{border:0;background:none;padding:0;font:inherit;color:var(--accent);font-weight:600;cursor:pointer}
@media (max-width:760px){.savebar{bottom:calc(64px + env(safe-area-inset-bottom,0px))}}
.sx-ico{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}.sx-m{color:#1f6fd1}.sx-f{color:#d63384}
.newown{display:grid;gap:6px;margin-top:8px;padding:10px;border:1px dashed var(--line);border-radius:8px}
.newown input,.newown select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font:inherit}
.og-h{display:flex;flex-direction:column;gap:0;margin:22px 0 8px}.og-t{font-family:var(--serif);font-weight:400;font-size:1.15rem}
.og summary{flex-direction:column;align-items:flex-start;gap:2px}.og summary .og-t{font-weight:400}
.og{margin:0 0 10px}
.orow{grid-template-columns:minmax(0,1fr) auto;padding:10px 16px}.orow-l{display:flex;flex-direction:column;min-width:0}.ofull{color:var(--muted)}
.lyear{font-family:var(--serif);font-weight:400;font-size:1.05rem;color:var(--muted);margin:26px 0 10px;display:flex;align-items:center;gap:10px}

.lcard{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.lplan{border-style:dashed;border-color:var(--warn);background:linear-gradient(0deg,var(--paper),var(--paper)),var(--warn-soft)}
.lhead{display:flex;align-items:center;gap:14px}
.lpics{display:flex;flex:none}.lpic{width:58px;height:58px;border-radius:50%;overflow:hidden;border:3px solid var(--paper);box-shadow:0 0 0 2px var(--accent);background:var(--bg);display:grid;place-items:center;font-family:var(--serif);color:var(--muted)}

.ltit{flex:1;min-width:0}.lnames{font-family:var(--serif);font-size:1.18rem;line-height:1.25}.lnames .plink{text-decoration:none}.lx{color:var(--accent);margin:0 2px}
.ldate{color:var(--muted);font-size:.9rem;margin-top:2px}.lstate{align-self:flex-start}
.lchips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.lchip{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border-radius:999px;padding:5px 12px;font-size:.88rem}
.lchip.ok{background:var(--ok-soft);color:var(--ok)}.lchip.coi-ok{background:var(--ok-soft);color:var(--ok)}.lchip.coi-warn{background:var(--warn-soft);color:var(--warn)}.lchip.coi-low{background:var(--bg)}
.lnotes{margin:10px 0 0;color:var(--muted);font-size:.9rem}
.lpups{margin-top:12px}
.lv-B{position:relative;padding-left:26px;border-left:3px solid var(--line);margin-left:8px}

.ownlink{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:14px 0 0}

/* Pedigree: l'elemento forte */

.ped-col{display:flex;flex-direction:column;justify-content:space-around;gap:6px}

<script>
/* ---------- Gestionale online: i dati arrivano dal database ---------- */
const D={dogs:{},owners:{},litters:{},matings:{}};
const FILES={},DOCF={};
/* ---------- Utilità ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>d?new Date(d+"T12:00").toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric"}):"";
const dn=id=>id&&D.dogs[id]?D.dogs[id].name:"";
const newId=p=>p+Math.random().toString(36).slice(2,8);
const STATUS={fattrice:["Fattrice","f"],stallone:["Stallone","f"],casa:["In casa",""],prenotato:["Prenotato","warn"],ceduto:["Ceduto","ok"],sterilizzata:["Sterilizzata",""],deceduto:["Deceduto",""]};

/* ---------- COI (formula di Wright, coefficiente di parentela) ---------- */
let kinMemo={},genMemo={};
function resetCalc(){kinMemo={};genMemo={};coiMemo={}}
/* COI dei cuccioli con il metodo di Wright, limitato a 8 generazioni come SBTPedigree */
const COI_GEN=8;let coiMemo={};
function routes(start,maxd){const out=[],st=[[start,1,[start]]];
  while(st.length){const [id,d,path]=st.pop();const x=D.dogs[id];if(!x)continue;out.push({a:id,d,path});
    if(d<maxd){if(x.sire)st.push([x.sire,d+1,path.concat(x.sire)]);if(x.dam)st.push([x.dam,d+1,path.concat(x.dam)])}}
  return out}
function coi8(s,d){if(!s||!d||!D.dogs[s]||!D.dogs[d])return 0;const key=s+"|"+d;if(key in coiMemo)return coiMemo[key];coiMemo[key]=0;
  const R2=routes(d,COI_GEN),by={};R2.forEach(r=>(by[r.a]=by[r.a]||[]).push(r));let t=0;
  for(const r of routes(s,COI_GEN)){const L=by[r.a];if(!L)continue;const A=D.dogs[r.a],FA=coi8(A.sire,A.dam),set=new Set(r.path.slice(0,-1));
    for(const q of L){if(q.path.slice(0,-1).some(x=>set.has(x)))continue;t+=Math.pow(.5,r.d+q.d-1)*(1+FA)}}
  return coiMemo[key]=t}
function gen(id){if(!id||!D.dogs[id])return -1;if(id in genMemo)return genMemo[id];genMemo[id]=0;const d=D.dogs[id];return genMemo[id]=1+Math.max(gen(d.sire),gen(d.dam))}
function F(id){const d=D.dogs[id];return d?coi8(d.sire,d.dam):0}
function kin(a,b){
  if(!a||!b||!D.dogs[a]||!D.dogs[b])return 0;
  if(a===b)return .5*(1+F(a));
  if(gen(a)<gen(b))[a,b]=[b,a];
  const k=a+"|"+b;if(k in kinMemo)return kinMemo[k];
  const d=D.dogs[a];return kinMemo[k]=.5*(kin(d.sire,b)+kin(d.dam,b));
}
function ancestors(id,depth){ // array per generazione
  const out=[];let cur=[id];
  for(let g=0;g<depth;g++){const nx=[];cur.forEach(x=>{const d=x&&D.dogs[x];nx.push(d?d.sire||null:null,d?d.dam||null:null)});out.push(nx);cur=nx}
  return out;
}
function coverage(sire,dam,depth=8){ // antenati noti su 8 generazioni, come SBT
  let known=0,tot=0;
  [sire,dam].forEach(p=>{tot++;if(p)known++;ancestors(p,depth-1).forEach(g=>g.forEach(x=>{tot++;if(x)known++}))});
  return {known,tot};
}
function commonAnc(s,d,depth=7){
  const a=new Set([s,...ancestors(s,depth).flat()].filter(Boolean));
  return [...new Set([d,...ancestors(d,depth).flat()].filter(x=>x&&a.has(x)))];
}
function band(p){
  if(p<6)return["Sotto la tua fascia ideale (6–9%)",""];
  if(p<=9)return["Dentro la tua fascia ideale (6–9%)","ok"];

/* Quanto pesa ogni antenato comune sul COI del gestionale (Wright, stessi percorsi di coi8): la somma = coi8 */
function coiParts(s,d){const by={},out={};if(!s||!d||!D.dogs[s]||!D.dogs[d])return out;
  routes(d,COI_GEN).forEach(r=>(by[r.a]=by[r.a]||[]).push(r));
  for(const r of routes(s,COI_GEN)){const L=by[r.a];if(!L)continue;const A=D.dogs[r.a],FA=coi8(A.sire,A.dam),set=new Set(r.path.slice(0,-1));
    for(const q of L){if(q.path.slice(0,-1).some(x=>set.has(x)))continue;out[r.a]=(out[r.a]||0)+Math.pow(.5,r.d+q.d-1)*(1+FA)}}
  return out}
function ancWeight(s,d){const P=coiParts(s,d),ids=Object.keys(P).filter(k=>P[k]>0).sort((a,b)=>P[b]-P[a]);
  if(!ids.length)return '<p class="row-meta">Nessun antenato in comune fra quelli inseriti.</p>';
  const tot=ids.reduce((t,k)=>t+P[k],0),mx=P[ids[0]],ord=n=>n+"ª";
  const row=k=>{const x=D.dogs[k],a=gensOf(s,k),b=gensOf(d,k);return `<div class="anc-row">${thumb(x)}<div class="anc-t"><button class="plink anc-n" data-a="open" data-v="${k}">${esc(x.name)}</button>
    <span class="row-meta">Lato padre: ${a.map(ord).join(", ")} gen. · Lato madre: ${b.map(ord).join(", ")} gen.</span><span class="aw-bar"><i style="width:${(P[k]/mx*100).toFixed(1)}%"></i></span></div>
    <div class="anc-r"><span class="anc-c" title="Quota del COI">${pf(P[k]*100)}%</span><span class="row-meta">${Math.round(P[k]/tot*100)}% del totale</span></div></div>`};
  const top=ids.slice(0,8),rest=ids.slice(8);
  return `<div class="anc-list">${top.map(row).join("")}</div>${rest.length?`<details class="aw-more"><summary>Altri ${rest.length} antenati in comune, con peso minore</summary><div class="anc-list">${rest.map(row).join("")}</div></details>`:""}`}

["1. Garanzie del cedente (allevatore)","1. Seller's (breeder's) guarantees",[]],
["1.1. Stato di salute alla consegna","1.1. State of health at delivery",[
["Alla data della consegna il cucciolo non presenta segni clinici di malattia. Le sverminazioni, gli esami, le vaccinazioni e le visite veterinarie eseguite risultano dal libretto sanitario e dai referti consegnati all'acquirente, elencati al punto 1.6. Il pedigree sarà consegnato all'acquirente secondo quanto previsto al punto 1.1d; l'acquirente ne prende atto.","On the date of delivery the puppy shows no clinical signs of disease. The dewormings, tests, vaccinations and veterinary visits carried out are recorded in the health booklet and in the reports handed to the buyer, listed in point 1.6. The pedigree will be delivered to the buyer as set out in point 1.1d; the buyer acknowledges this."],
["1.1a Il cedente garantisce il cucciolo contro le malattie infettive del cane, fra cui parvovirosi e cimurro, per 15 giorni dalla consegna, periodo che copre l'incubazione delle principali malattie infettive. In caso di morte del cucciolo per una di queste malattie, accertata da un veterinario, si applicano i rimedi del punto 1.3.","1.1a The seller guarantees the puppy against infectious canine diseases, including parvovirus and distemper, for 15 days from delivery, a period covering the incubation of the main infectious diseases. If the puppy dies of one of these diseases, as confirmed by a veterinarian, the remedies in point 1.3 apply."],
["1.1b L'acquirente ha 72 ore dalla consegna per far esaminare il cucciolo da un veterinario di sua fiducia. Ogni reclamo concernente la salute del cucciolo deve essere fatto entro questo periodo e sarà verificato dal veterinario di fiducia del cedente. In caso di disaccordo fra i due veterinari, le parti incaricano di comune accordo un terzo veterinario, il cui parere è definitivo; le relative spese sono divise a metà.","1.1b The buyer has 72 hours from delivery to have the puppy examined by a veterinarian of their choice. Any complaint concerning the puppy's health must be made within this period and will be checked by the seller's veterinarian. If the two veterinarians disagree, the parties jointly appoint a third veterinarian, whose opinion is final; the related costs are split equally."],
["1.1c L'acquirente, al momento della presa in consegna, è completamente soddisfatto dell'apparenza estetica del cucciolo in relazione all'età e rinuncia a qualunque reclamo futuro concernente la conformazione e l'apparenza estetica rispetto allo standard della razza.","1.1c At the time of taking delivery, the buyer is fully satisfied with the puppy's appearance for its age and waives any future complaint concerning conformation and appearance in relation to the breed standard."],
["1.1d Il cedente ha già espletato le procedure previste dall'ENCI per l'iscrizione del cucciolo al Libro Origini Italiano (LOI). Il pedigree, una volta rilasciato, viene inviato dall'ENCI alla Delegazione ENCI della città di residenza dell'acquirente, presso la quale l'acquirente lo ritira. Il ritiro comporta un costo, attualmente di 25 €, a carico dell'acquirente.","1.1d The seller has already completed the ENCI procedures for registering the puppy in the Italian Stud Book (LOI). Once issued, the pedigree is sent by ENCI to the ENCI office of the city where the buyer lives, where the buyer collects it. Collection involves a fee, currently €25, paid by the buyer."]]],
["1.2. Vaccinazioni e sverminazioni","1.2. Vaccinations and deworming",[["Il cane discende da genitori più volte sverminati e vaccinati ed è stato sottoposto a sverminazione e alle usuali vaccinazioni preventive, come da libretto sanitario consegnato all'acquirente.","The dog descends from parents that have been dewormed and vaccinated several times, and has been dewormed and given the usual preventive vaccinations, as shown in the health booklet handed to the buyer."]]],
["1.3. Malattie o imperfezioni nascoste","1.3. Hidden diseases or defects",[
["Il cedente conferma di non essere a conoscenza di malattie o imperfezioni nascoste. In caso di manifestazione di malattie nascoste, confermate da un veterinario entro 20 giorni dalla presa in consegna, il cedente, a sua scelta:<br>– riprende il cane e restituisce l'intero prezzo di cessione; oppure<br>– sostituisce il cane con un altro cucciolo della stessa razza, appena disponibile; oppure,<br>– se l'acquirente preferisce tenere il cane, contribuisce alle spese veterinarie documentate fino a un massimo di 200 €.","The seller confirms that they are not aware of any hidden diseases or defects. If hidden diseases appear and are confirmed by a veterinarian within 20 days of delivery, the seller, at their choice:<br>– takes the dog back and refunds the full price; or<br>– replaces the dog with another puppy of the same breed as soon as one is available; or<br>– if the buyer prefers to keep the dog, contributes to documented veterinary costs up to a maximum of €200."],
["L'onere di provare la malattia spetta all'acquirente; le prove devono essere avallate dal veterinario di fiducia del cedente, fermo quanto previsto al punto 1.1b in caso di disaccordo.","The burden of proving the disease lies with the buyer; the evidence must be endorsed by the seller's veterinarian, subject to point 1.1b in case of disagreement."],
["Per spese veterinarie documentate si intendono esclusivamente le spese per la diagnosi e la cura della malattia nascosta accertata ai sensi del presente punto, risultanti da fattura o ricevuta intestata all'acquirente, emessa da un medico veterinario e recante il numero di microchip del cane, accompagnata dal referto o dalla diagnosi. Sono escluse le vaccinazioni, le sverminazioni, i trattamenti antiparassitari, le visite di controllo di routine, l'alimentazione, anche dietetica, e le spese di viaggio. Le copie dei documenti vanno presentate al cedente entro 30 giorni dalla data della fattura; il cedente rimborsa entro 30 giorni dal ricevimento, fino al massimo indicato.","Documented veterinary costs means only the costs of diagnosing and treating the hidden disease established under this point, shown on an invoice or receipt in the buyer's name, issued by a veterinarian and bearing the dog's microchip number, together with the report or diagnosis. Vaccinations, dewormings, antiparasitic treatments, routine check-ups, food (including dietary food) and travel costs are excluded. Copies of the documents must be given to the seller within 30 days of the invoice date; the seller reimburses within 30 days of receipt, up to the stated maximum."]]],
["1.4. Garanzia genetica","1.4. Genetic guarantee",[
["Entrambi i genitori del cucciolo sono risultati esenti (clear) ai test del DNA per la L-2-idrossiglutarico aciduria (L2-HGA) e per la cataratta ereditaria (HC, gene HSF4). I referti, che riportano il numero di microchip di ciascun genitore, sono consegnati in copia all'acquirente. Il cucciolo è pertanto esente per ascendenza da entrambe le malattie.","Both of the puppy's parents tested clear in the DNA tests for L-2-hydroxyglutaric aciduria (L2-HGA) and hereditary cataract (HC, HSF4 gene). Copies of the reports, showing each parent's microchip number, are given to the buyer. The puppy is therefore clear by parentage for both diseases."],
["Se, per tutta la vita del cane, venisse accertata con test del DNA eseguito da un laboratorio riconosciuto la presenza di L2-HGA o di cataratta ereditaria HC da gene HSF4, il cedente restituisce all'acquirente l'intero prezzo di cessione. L'acquirente conserva il cane.","If, at any time during the dog's life, a DNA test performed by a recognised laboratory establishes L2-HGA or hereditary cataract HC (HSF4 gene), the seller refunds the full price to the buyer. The buyer keeps the dog."]]],
["1.5. Età alla consegna e identificazione","1.5. Age at delivery and identification",[["Il cucciolo viene consegnato non prima dei 60 giorni di vita, come previsto dalla normativa vigente. Alla consegna è già identificato con microchip e registrato nell'Anagrafe regionale degli animali d'affezione a nome del cedente.","The puppy is delivered no earlier than 60 days of age, as required by law. At delivery it is already identified by microchip and registered in the regional pet registry in the seller's name."]]],
["1.6. Documenti consegnati","1.6. Documents delivered",[["Alla consegna il cedente consegna all'acquirente:<br>– il libretto sanitario, con vaccinazioni e sverminazioni;<br>– il certificato di applicazione del microchip e l'attestato di iscrizione all'anagrafe;<br>– il modulo di passaggio di proprietà, firmato dal cedente;<br>– la copia dei referti genetici dei genitori (punto 1.4);<br>– la copia dei referti degli esami eseguiti sulla cucciolata, se presenti;<br>– le istruzioni scritte su alimentazione, crescita e cura;<br>– una copia firmata del presente contratto.<br>Il pedigree non è compreso nella consegna: si ritira presso la Delegazione ENCI, come previsto al punto 1.1d.","At delivery the seller gives the buyer:<br>– the health booklet, with vaccinations and dewormings;<br>– the microchip certificate and the registry certificate;<br>– the change-of-ownership form, signed by the seller;<br>– a copy of the parents' genetic reports (point 1.4);<br>– a copy of the reports of tests carried out on the litter, if any;<br>– written instructions on feeding, growth and care;<br>– a signed copy of this contract.<br>The pedigree is not included in the delivery: it is collected at the ENCI office, as set out in point 1.1d."]]],
["1.7. Esclusione di altre garanzie","1.7. Exclusion of other guarantees",[["Sono escluse altre garanzie. In particolare il cedente non si assume alcuna responsabilità per lo sviluppo o la futura idoneità per l'allevamento del cane. Le eventuali imperfezioni visibili sono considerate accettate. Restano in ogni caso fatti salvi i diritti inderogabili eventualmente riconosciuti dalla legge all'acquirente qualora agisca in qualità di consumatore.","Other guarantees are excluded. In particular, the seller accepts no responsibility for the dog's development or future suitability for breeding. Any visible imperfections are deemed accepted. In any case, the mandatory rights granted by law to the buyer as a consumer remain unaffected."]]],
["2. Consulenza da parte del cedente","2. Advice from the seller",[["Il cedente consiglia l'acquirente sulla detenzione, alimentazione e cura del cane. L'acquirente ha diritto a rivolgersi al cedente con domande al riguardo per tutta la vita del cane.","The seller advises the buyer on keeping, feeding and caring for the dog. The buyer may ask the seller questions on these matters for the whole of the dog's life."]]],
["3. Doveri dell'acquirente","3. Buyer's duties",[]],
["3.1. Detenzione adeguata dell'animale","3.1. Proper keeping of the animal",[
["L'acquirente si impegna a tenere, nutrire e curare il cane in modo adeguato e a garantirgli una sufficiente assistenza veterinaria (fra l'altro con vaccinazioni preventive e regolari controlli dello stato di salute). L'acquirente segue le istruzioni scritte del cedente in fatto di detenzione, cura, alloggio ed eventuale uso per l'allevamento dell'animale.","The buyer undertakes to keep, feed and care for the dog properly and to ensure adequate veterinary care (including preventive vaccinations and regular health checks). The buyer follows the seller's written instructions on the keeping, care, housing and any breeding use of the animal."],
["NEI PRIMI 8/9 MESI DI VITA IL CUCCIOLO NON DEVE ESSERE FORZATO A CORRERE, SALTARE, SALIRE LE SCALE ecc. o comunque a compiere sforzi tali da comprometterne il corretto e fisiologico sviluppo fisico e psicofisico.","DURING THE FIRST 8/9 MONTHS THE PUPPY MUST NOT BE FORCED TO RUN, JUMP, CLIMB STAIRS etc., or to make any effort that could compromise its correct and natural physical and mental development."],
["L'acquirente evita qualsiasi maltrattamento o sevizia e non ne tollera nemmeno da parte di terzi. Si impegna inoltre a non fare praticare l'eutanasia al cane senza gravi motivi veterinari.","The buyer avoids any mistreatment or cruelty and does not tolerate it from others either. The buyer also undertakes not to have the dog euthanised without serious veterinary reasons."]]],
["3.2. Diritti dell'allevatore {T32}","3.2. Breeder's rights {T32EN}",[["{P32}","{P32EN}"]]],
["3.2.A. Sterilizzazione","3.2.A. Neutering",[
["L'acquirente si impegna a non sottoporre il cane a sterilizzazione prima dei tre anni di vita, così da non comprometterne il corretto e fisiologico sviluppo fisico e psicofisico. Qualsiasi sterilizzazione va comunque concordata preventivamente con il cedente.","The buyer undertakes not to have the dog neutered before three years of age, so as not to compromise its correct and natural physical and mental development. Any neutering must in any case be agreed in advance with the seller."],
["Fanno eccezione le malattie documentate dal veterinario dell'acquirente che mettano a repentaglio la vita o il benessere del cane. Se l'intervento non è urgente, l'acquirente ne informa prima il cedente e gli trasmette la documentazione, perché possa sentire il parere del proprio veterinario di fiducia. Se è urgente, il veterinario curante può procedere senza attendere, e l'acquirente trasmette la documentazione al cedente entro 7 giorni.","Exceptions are diseases documented by the buyer's veterinarian that endanger the dog's life or wellbeing. If the operation is not urgent, the buyer informs the seller first and sends the documentation, so that the seller can consult their own veterinarian. If it is urgent, the treating veterinarian may proceed without waiting, and the buyer sends the documentation to the seller within 7 days."],
["Qualora l'acquirente non rispetti il presente punto 3.2.A, è tenuto a corrispondere al cedente un risarcimento pari alla metà del prezzo di cessione.","If the buyer does not comply with this point 3.2.A, the buyer must pay the seller compensation equal to half the price."]]],
["3.3. Cessione ad altri del cane e riconsegna al cedente","3.3. Transfer of the dog to others and return to the seller",[
["L'acquirente dichiara espressamente di NON essere un negoziante o rivenditore di animali e che il cane viene acquistato per sé stesso.","The buyer expressly declares that they are NOT a pet shop or animal dealer and that the dog is being acquired for themselves."],
["Se per qualsiasi motivo non potesse più tenere il cane, o volesse cederlo ad altri, per tutta la vita del cane l'acquirente si impegna, prima di qualsiasi cessione, a:<br>– informare per iscritto il cedente;<br>– indicarne il motivo e documentarlo, per esempio con certificati medici, documentazione di un trasferimento o relazione del veterinario o dell'educatore in caso di problemi di comportamento;<br>– comunicare nome, cognome, indirizzo e recapiti del nuovo proprietario proposto, che al momento della presa in consegna, previo regolare passaggio di proprietà, dovrà sottoscrivere le medesime condizioni del presente contratto.","If for any reason the buyer can no longer keep the dog, or wishes to transfer it to others, for the whole of the dog's life the buyer undertakes, before any transfer, to:<br>– inform the seller in writing;<br>– state and document the reason, for example with medical certificates, documentation of a relocation, or a report from the veterinarian or trainer in case of behavioural problems;<br>– provide the name, address and contact details of the proposed new owner, who, on taking delivery and after a regular change of ownership, must sign the same conditions as this contract."],
["Se il cedente non è d'accordo con la cessione proposta, ha diritto a riprendersi il cane dopo un'adeguata detrazione dal prezzo d'acquisto originale; per il prezzo di ritiro sono determinanti la ricollocabilità e le condizioni fisiche e psichiche dell'animale. Il cedente comunica per iscritto all'acquirente, entro due settimane dalla comunicazione, se intende esercitare o meno questo diritto.","If the seller does not agree with the proposed transfer, the seller has the right to take the dog back after a suitable deduction from the original purchase price; the take-back price depends on how easily the dog can be rehomed and on its physical and mental condition. The seller informs the buyer in writing, within two weeks of the notice, whether or not they intend to exercise this right."],
["Riconsegna al cedente. In qualsiasi momento della vita del cane l'acquirente può riconsegnarlo al cedente, che si impegna a riprenderlo. La riconsegna al cedente non comporta mai l'applicazione della penale di cui al punto 5.","Return to the seller. At any time during the dog's life the buyer may return it to the seller, who undertakes to take it back. Returning the dog to the seller never triggers the penalty in point 5."]]],
["3.4. Responsabilità dell'acquirente dopo la consegna","3.4. Buyer's responsibility after delivery",[["Dal momento della consegna, la cura, il mantenimento, l'educazione, la custodia e la sorveglianza del cane sono di esclusiva responsabilità dell'acquirente. In particolare, il cane non deve mai essere lasciato senza la supervisione di un adulto in presenza di bambini piccoli. Il cedente non si assume alcuna responsabilità per danni a persone, animali o cose, né per lesioni o incidenti, causati dal cane o occorsi al cane, successivamente alla consegna all'acquirente.","From delivery, the care, upkeep, training, custody and supervision of the dog are the sole responsibility of the buyer. In particular, the dog must never be left without adult supervision in the presence of young children. The seller accepts no responsibility for damage to people, animals or property, nor for injuries or accidents caused by or to the dog, after delivery to the buyer."]]],
["3.5. Anagrafe canina","3.5. Pet registry",[["Il passaggio di proprietà va registrato nell'Anagrafe regionale degli animali d'affezione entro 15 giorni dalla consegna. Il cedente comunica la cessione, con il modulo firmato da entrambe le parti e la copia dei documenti d'identità. L'acquirente completa la registrazione del cane a proprio nome presso l'anagrafe del Comune di residenza, o della propria regione se risiede fuori dall'Emilia-Romagna, e ne invia copia al cedente. Allo stesso modo l'acquirente comunica al cedente ogni successivo cambio di residenza, lo smarrimento e la morte del cane.","The change of ownership must be recorded in the regional pet registry within 15 days of delivery. The seller notifies the transfer, with the form signed by both parties and copies of their identity documents. The buyer completes the registration of the dog in their own name at the registry of their municipality, or of their region if they live outside Emilia-Romagna, and sends a copy to the seller. Likewise, the buyer informs the seller of any later change of residence, and of the loss or death of the dog."]]],
["3.6. Fotografie e dati personali","3.6. Photos and personal data",[["I dati personali dell'acquirente sono usati dal cedente solo per l'esecuzione del presente contratto e per gli adempimenti di legge, fra cui l'anagrafe canina e l'iscrizione ENCI. Le foto del cane fornite dall'acquirente possono essere pubblicate dal cedente secondo il punto 3.2. Per le foto in cui compaiono persone, e per la citazione del nome dell'acquirente, vale la scelta seguente:","The buyer's personal data are used by the seller only to perform this contract and for legal obligations, including the pet registry and ENCI registration. Photos of the dog provided by the buyer may be published by the seller under point 3.2. For photos showing people, and for mentioning the buyer's name, the following choice applies:"],["{C36}","{C36EN}"]]],
["4. Caparra","4. Deposit",[["La caparra già versata dall'acquirente vale a titolo di caparra confirmatoria ai sensi dell'art. 1385 del Codice Civile e viene detratta dal prezzo di cessione al momento della consegna. Se l'acquirente rinuncia al cucciolo, il cedente trattiene la caparra. Se il cucciolo muore o si ammala gravemente prima della consegna, il cedente restituisce la caparra per intero, oppure, se l'acquirente lo preferisce, la mantiene valida per un altro cucciolo. Negli altri casi di mancata consegna imputabili al cedente si applica l'art. 1385 del Codice Civile.","The deposit already paid by the buyer is a confirmatory deposit under Article 1385 of the Italian Civil Code and is deducted from the price at delivery. If the buyer withdraws, the seller keeps the deposit. If the puppy dies or becomes seriously ill before delivery, the seller refunds the deposit in full or, if the buyer prefers, keeps it valid for another puppy. In other cases of non-delivery attributable to the seller, Article 1385 of the Civil Code applies."]]],
["4-bis. Pagamento del saldo e riserva di proprietà","4-bis. Payment of the balance and retention of title",[["Il saldo del prezzo di cessione, cioè il prezzo al netto della caparra già versata, si paga al momento della presa in consegna del cucciolo.<br>In deroga al principio del consenso traslativo (art. 1376 c.c.), la proprietà del cane passa all'acquirente solo con il pagamento integrale del saldo (riserva della proprietà, art. 1523 c.c.). Fino a quel momento il cane resta di proprietà del cedente, che può rifiutarne la consegna finché il saldo non è pagato (eccezione di inadempimento, art. 1460 c.c.).<br>Se il saldo non viene pagato alla data concordata per la presa in consegna, il cedente può recedere dal contratto con semplice comunicazione scritta, anche tramite email o messaggio, e trattenere la caparra (art. 1385, secondo comma, c.c.). Resta fermo quanto previsto al punto 4 se il cucciolo muore o si ammala gravemente prima della consegna.","The balance of the price, that is the price less the deposit already paid, is paid when the puppy is collected.<br>By way of exception to the rule that ownership passes on agreement (Art. 1376 Italian Civil Code), ownership of the dog passes to the buyer only upon full payment of the balance (retention of title, Art. 1523 Italian Civil Code). Until then the dog remains the property of the seller, who may refuse delivery until the balance is paid (Art. 1460 Italian Civil Code).<br>If the balance is not paid on the date agreed for collection, the seller may withdraw from the contract by simple written notice, including by email or message, and keep the deposit (Art. 1385, second paragraph, Italian Civil Code). Point 4 still applies if the puppy dies or becomes seriously ill before delivery."]],"2026-10b"],
["5. Penale","5. Penalty",[["Se l'acquirente cede il cane a terzi senza rispettare il punto 3.3, cioè senza averne informato preventivamente il cedente, indicato e documentato il motivo e comunicato i dati del nuovo proprietario, oppure se lo vende a negozianti o rivenditori di animali, è tenuto a corrispondere al cedente una penale pari al triplo del prezzo di cessione, fatta salva la dimostrazione dell'ulteriore danno. Le parti danno atto che la penale ha funzione di rafforzamento degli obblighi assunti e di predeterminazione del danno. La penale non si applica in caso di riconsegna del cane al cedente.","If the buyer transfers the dog to third parties without complying with point 3.3, that is without first informing the seller, stating and documenting the reason and providing the new owner's details, or sells it to pet shops or animal dealers, the buyer must pay the seller a penalty equal to three times the price, without prejudice to proof of further damage. The parties acknowledge that the penalty serves to reinforce the obligations undertaken and to pre-determine the damage. The penalty does not apply if the dog is returned to the seller."]]],
["6. Foro competente","6. Jurisdiction",[["Nel caso di eventuali controversie derivanti dal presente contratto il foro competente è quello di Ferrara. Qualora l'acquirente rivesta la qualità di consumatore ai sensi di legge, resta ferma la competenza inderogabile del foro del luogo di sua residenza o domicilio elettivo.<br>Ogni parte contraente riceve una copia di questo contratto.","Any disputes arising from this contract fall under the jurisdiction of the court of Ferrara. If the buyer is a consumer under the law, the mandatory jurisdiction of the court of their place of residence or chosen domicile remains unaffected.<br>Each party receives a copy of this contract."]]]
];

M:["(monta, prima scelta e immagine)","(stud use, first pick and image)","Per il cane, in questo caso MASCHIO, l'acquirente accetta di consentire all'allevatore fino a un massimo di due monte a titolo gratuito per femmine di sua proprietà, ed ogni diritto di immagine su eventuali risultati di esposizioni canine. L'acquirente accetta di fornire all'allevatore foto del cane e copie dei giudizi e certificati eventualmente assegnati in esposizione e di permetterne l'uso per la promozione, e di mostrare l'animale per controlli sulle sue condizioni e sulla sua crescita quando richiesto. Le eventuali proposte di accoppiamento ricevute dall'acquirente dovranno essere valutate insieme all'allevatore al fine di preservare la selezione genetica e gli standard di razza. Da ogni cucciolata nata da monte con soggetti terzi spetta all'allevatore, qualora possibile, la prima scelta di un cucciolo, a un prezzo di cortesia. I proventi derivanti da eventuali monte a pagamento con soggetti terzi NON saranno divisi fra le parti ma saranno appannaggio dell'acquirente.","For the dog, in this case a MALE, the buyer agrees to allow the breeder up to a maximum of two free matings with females owned by the breeder, and grants all image rights over any dog show results. The buyer agrees to provide the breeder with photos of the dog and copies of any show critiques and certificates, to allow their use for promotion, and to show the animal for checks on its condition and growth when requested. Any mating proposals received by the buyer must be assessed together with the breeder, in order to preserve genetic selection and breed standards. From every litter sired with third parties' females, the breeder is entitled, where possible, to first pick of a puppy at a courtesy price. Income from any paid matings with third parties will NOT be shared between the parties and belongs to the buyer."],
F:["(accoppiamenti, prima scelta e immagine)","(matings, first pick and image)","Per il cane, in questo caso FEMMINA, l'acquirente non è in alcun modo obbligato a farla riprodurre. Qualora decida di farlo, accetta che ogni eventuale accoppiamento sia subordinato all'approvazione dell'allevatore, per iscritto, dello stallone prescelto, al fine di preservare la selezione genetica e gli standard di razza. Da ogni eventuale cucciolata spetta all'allevatore la prima scelta di un cucciolo, a un prezzo di cortesia. I proventi derivanti dalla vendita degli altri cuccioli sono appannaggio dell'acquirente.<br>L'acquirente riconosce inoltre all'allevatore ogni diritto di immagine su eventuali risultati di esposizioni canine, e accetta di fornirgli foto del cane e copie dei giudizi e certificati eventualmente assegnati in esposizione e di permetterne l'uso per la promozione, e di mostrare l'animale per controlli sulle sue condizioni e sulla sua crescita quando richiesto.","For the dog, in this case a FEMALE, the buyer is under no obligation to breed her. If the buyer decides to do so, every mating is subject to the breeder's written approval of the chosen stud, in order to preserve genetic selection and breed standards. From every litter the breeder is entitled to first pick of a puppy at a courtesy price. Income from the sale of the other puppies belongs to the buyer.<br>The buyer also grants the breeder all image rights over any dog show results, and agrees to provide photos of the dog and copies of any show critiques and certificates, to allow their use for promotion, and to show the animal for checks on its condition and growth when requested."]};

let mateS="forever",mateD="queen",MATE_DT=null;
function mateFemales(){return Object.keys(D.dogs).filter(k=>{const d=D.dogs[k];return d.sex==="F"&&!d.ext&&(d.status==="fattrice"||d.fattr)&&d.status!=="sterilizzata"&&d.status!=="deceduto"}).sort((a,b)=>dn(a).localeCompare(dn(b)))}
function dogAge(d){const y=d.birth?new Date(d.birth):d.year?new Date(d.year+"-06-01"):null;return y?(Date.now()-y)/3.156e10:null}
function mateMales(){return Object.keys(D.dogs).filter(k=>{const d=D.dogs[k],a=dogAge(d);return d.sex==="M"&&d.status!=="deceduto"&&(d.sbtAdded||(a!==null&&a>=1&&a<=12))}).sort((a,b)=>dn(a).localeCompare(dn(b)))}
// COI della coppia: SBT se c'è (analisi della cucciolata o valore inserito), altrimenti Wright solo se affidabile
function pairCoi(s,d){const l=Object.values(D.litters).find(x=>x.sire===s&&x.dam===d&&x.sbtA&&x.sbtA.c8);if(l)return{v:pc(l.sbtA.c8),src:"sbt"};
  const m=mateSbt(s,d);if(!isNaN(m))return{v:m,src:"sbt"};const cv=coverage(s,d),r=cv.tot?cv.known/cv.tot:0;return{v:coi8(s,d)*100,src:r>=.7?"wright":"low",cov:Math.round(r*100)}}
function mating(){const F=mateFemales();if(!F.includes(mateD))mateD=F[0]||null;const M=mateMales();
  const lab=k=>{const d=D.dogs[k];let t=`${d.name}${d.nick?" (“"+d.nick+"”)":""}${d.birth||d.year?" · "+String(d.birth||d.year).slice(0,4):""}`;if(!mateD)return t;
    const p=pairCoi(k,mateD),ic=p.src==="low"?"⚪":p.v<6?"🔵":p.v<=9?"🟢":"🔴";return `${ic} ${t} — ${p.src==="sbt"?"COI SBT "+pf(p.v)+"%":p.src==="wright"?"COI "+pf(p.v)+"%":"COI non affidabile"}`};
  const og=(t,ks)=>ks.length?`<optgroup label="${t}">${ks.map(k=>`<option value="${k}" ${k===mateS?"selected":""}>${esc(lab(k))}</option>`).join("")}</optgroup>`:"";
  const NO=mateD?M.filter(k=>enciRel(mateD,k)):[],MS=M.filter(k=>!NO.includes(k)||(k===mateS&&!MATE_NO));
  const ogNo=NO.length&&MATE_NO?`<optgroup label="🚫 Non permessi dall'ENCI">${NO.map(k=>`<option value="${k}" ${k===mateS?"selected":""}>🚫 ${esc(D.dogs[k].name)} — ${esc(enciRel(mateD,k))}</option>`).join("")}</optgroup>`:"";
  return `<h1>Accoppiamenti</h1><p class="lead">Scegli la fattrice e il maschio. Accanto a ogni maschio c'è già il COI con la fattrice scelta: 🟢 nella tua fascia 6–9% · 🔵 sotto · 🔴 sopra · ⚪ non affidabile (pedigree incompleto).</p>
  <div class="pick"><label>Femmina<select id="md">${F.map(k=>`<option value="${k}" ${k===mateD?"selected":""}>${esc((D.dogs[k].nick?D.dogs[k].nick+" – ":"")+D.dogs[k].name)}</option>`).join("")}</select></label>
  <label>Maschio<select id="ms"><option value="">— scegli il maschio —</option>${og("I tuoi maschi",MS.filter(k=>!D.dogs[k].ext))}${og("Stalloni in archivio",MS.filter(k=>D.dogs[k].ext))}${ogNo}</select></label></div>
  ${NO.length?`<p class="row-meta en-no">🚫 ${NO.length} ${NO.length===1?"maschio non permesso":"maschi non permessi"} dall'ENCI per parentela con ${esc(D.dogs[mateD].nick||D.dogs[mateD].name)} ${MATE_NO?"sono in fondo all'elenco":"non compaiono nell'elenco"} · <button class="plink" data-a="mateNo">${MATE_NO?"nascondili":"mostrali"}</button></p>`:""}
  <div class="addsbt"><b>➕ Aggiungi un maschio da SBTpedigree</b><p class="row-meta" style="margin:4px 0 0">Incolla il link della sua pagina su SBT: provo a leggere nome, nascita e genitori. Se SBT non lo lascia leggere, ti chiedo solo il nome.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><input id="sbtUrl" placeholder="https://sbtpedigree.com/dog_details?dogs_id=…" style="flex:1;min-width:220px"><button class="btn small" data-a="sbtAdd">Aggiungi</button></div></div>
  <div id="mateOut"></div>`}
function gensOf(root,x,depth=7){const g=[];if(root===x)g.push(1);ancestors(root,depth).forEach((c,i)=>c.forEach(y=>{if(y===x)g.push(i+2)}));return g}
function ancList(com,S=mateS,M=mateD){if(!com.length)return '<p class="row-meta">Nessun antenato in comune fra quelli inseriti.</p>';
  const ord=n=>n+"ª";
  const items=com.map(x=>{const a=gensOf(S,x),b=gensOf(M,x);return{x,a,b,n:a.length+b.length,min:Math.min(...a,...b)}})
    .sort((p,q)=>q.n-p.n||p.min-q.min||dn(p.x).localeCompare(dn(q.x)));
  return `<h3 class="anc-h">Antenati in comune <span>${items.length}</span></h3><p class="row-meta" style="margin:0 0 8px">Generazioni contate dai cuccioli: 1ª = genitori, 2ª = nonni, 3ª = bisnonni…</p>
  <div class="anc-list">${items.map(({x,a,b,n})=>{const d=D.dogs[x];
    return `<div class="anc-row">${thumb(d)}<div class="anc-t"><button class="plink anc-n" data-a="open" data-v="${x}">${esc(d.name)}</button>

    <div class="anc-r"><span class="anc-c" title="Volte nel pedigree">${n}×</span>${d.sbt?`<a href="https://sbtpedigree.com/dog_details?dogs_id=${encodeURIComponent(d.sbt)}" target="_blank" rel="noopener">SBT ↗</a>`:""}</div></div>`}).join("")}</div>`}
const pc=v=>v?parseFloat(String(v).replace(",",".")):NaN;
const pf=n=>n.toFixed(2).replace(".",",");
function mateSbt(s,d){const m=D.matings&&D.matings[s+"|"+d];return m&&m.coiSbt?pc(m.coiSbt):NaN}
function setMateSbt(v){D.matings=D.matings||{};const k=mateS+"|"+mateD;const t=v.trim().replace("%","");
  if(t&&isNaN(pc(t)))return;D.matings[k]=Object.assign(D.matings[k]||{},{coiSbt:t});calcMate()}
function calcMate(){

  const enS=reproState(mateD),mdt=MATE_DT||(enS.preg?enS.m.date:enS.next&&enS.next>todayS()?addD(enS.next,12):addD(todayS(),30)),ER=enciCheck(mateD,mateS,mdt);

  const p=pairCoi(mateS,mateD),w=coi8(mateS,mateD)*100,cov=coverage(mateS,mateD),b=p.src==="low"?["Pedigree incompleto: COI poco affidabile",""]:band(p.v),m=(D.matings||{})[mateS+"|"+mateD]||{};
  const lit=Object.entries(D.litters).find(([,l])=>l.sire===mateS&&l.dam===mateD),ds=D.dogs[mateS],dd=D.dogs[mateD];
  const miss=[mateS,mateD].map(k=>{const c=pedCount(k);return c.k<c.t*.9?`<button class="btn ghost small" data-a="pedForm" data-v="${k}">Completa il pedigree di ${esc(dn(k).split(" ")[0])} (${c.k}/${c.t})</button>`:""}).join("");
  o.innerHTML=`<div class="res"><p class="row-meta" style="margin:0">Coppia${lit?" · 🐾 già "+(lit[1].state==="pianificata"?"pianificata":"fatta"):""}</p><h2 style="margin:2px 0 8px">${esc(dd.nick||dd.name)} × ${esc(ds.name)}</h2>
   <div style="display:flex;gap:14px;align-items:baseline;flex-wrap:wrap"><span class="cnum">${pf(p.v)}<small>%</small></span><span class="badge ${b[1]}">${b[0]}</span>
   <span class="row-meta">${p.src==="sbt"?"COI SBT 8 generazioni":`COI del gestionale (Wright, 8 gen.) · antenati inseriti ${cov.known} di ${cov.tot}`}</span></div>
   ${p.src==="sbt"?`<p class="row-meta" style="margin:6px 0 0">Calcolo del gestionale: ${pf(w)}% · antenati inseriti ${cov.known} di ${cov.tot}</p>`:""}
   <p class="row-meta" style="margin:8px 0 0"><label class="sbt-in">COI SBT del test mating: <input id="mateSbt" inputmode="decimal" placeholder="es. 6,17" value="${esc(m.coiSbt||"")}">%</label></p>

let VERSION=0,lastJ="",EMPTY=false,BUSY=false,SAVE={at:null,msg:"",err:""};
const nowS=()=>new Date().toLocaleString("it-IT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const isObj=v=>v&&typeof v==="object"&&!Array.isArray(v);
function diff(b,c){const out={};let n=0;
  for(const k of Object.keys(c)){const bv=b?b[k]:undefined,cv=c[k];
    if(bv===undefined){out[k]={$set:cv};n++}
    else if(isObj(bv)&&isObj(cv)){const d=diff(bv,cv);if(d){out[k]=d;n++}}
    else if(Array.isArray(bv)&&Array.isArray(cv)){const bs=new Set(bv.map(x=>JSON.stringify(x))),cs=new Set(cv.map(x=>JSON.stringify(x)));
      const add=cv.filter(x=>!bs.has(JSON.stringify(x))),del=bv.filter(x=>!cs.has(JSON.stringify(x))).map(x=>JSON.stringify(x));
      if(add.length||del.length){out[k]={$add:add,$del:del};n++}}
    else if(JSON.stringify(bv)!==JSON.stringify(cv)){out[k]={$set:cv};n++}}
  for(const k of Object.keys(b||{}))if(!(k in c)){out[k]={$unset:true};n++}
  return n?out:null}
function applyP(t,p,safe){let n=0;for(const k of Object.keys(p)){const o=p[k];
    if(o.$unset){if(!safe&&k in t){delete t[k];n++}}
    else if("$set" in o){if(!safe||!(k in t)){t[k]=o.$set;n++}}
    else if(o.$add){if(!Array.isArray(t[k]))t[k]=[];const have=new Set(t[k].map(x=>JSON.stringify(x)));
      if(!safe&&o.$del.length){const del=new Set(o.$del);const L=t[k].length;t[k]=t[k].filter(x=>!del.has(JSON.stringify(x)));n+=L-t[k].length}
      o.$add.forEach(x=>{if(!have.has(JSON.stringify(x))){t[k].push(x);n++}})}
    else{if(!isObj(t[k]))t[k]={};n+=applyP(t[k],o,safe)}}return n}

    mateS=nid;render();saveNow();return}
  if(a==="ctWa"){const d=D.dogs[v],o=D.owners[d.owner];if(!o.token){o.token=randTok();saveNow()}const url=location.origin+"/p/"+o.token,en=o.lang==="en",first=(o.name||"").split(" ")[0];
    const msg=en?`Hi ${first}, the sale agreement for ${d.name} is ready. You can read and sign it on your private page (with your finger on a phone, with the mouse on a computer): ${url}`:`Ciao ${first}, il contratto di cessione di ${d.name} è pronto. Lo leggi e lo firmi nella tua pagina privata (col dito dal telefono, col mouse dal computer): ${url}`;
    let ph=String(o.phone||"").replace(/[^\d+]/g,"");if(ph.startsWith("+"))ph=ph.slice(1);else if(ph.startsWith("00"))ph=ph.slice(2);else if(ph&&(o.country||"Italia")==="Italia")ph="39"+ph;
    window.open("https://wa.me/"+(ph||"")+"?text="+encodeURIComponent(msg),"_blank","noopener");return}
  if(a==="copyLink"){try{await navigator.clipboard.writeText(location.origin+"/p/"+D.owners[v].token);toast("Link copiato: incollalo su WhatsApp o in una email.")}catch(err){prompt("Copia il link:",location.origin+"/p/"+D.owners[v].token)}}
  if(a==="newToken"){const o=D.owners[v];if(o.token&&!confirm("Il link attuale smetterà di funzionare e dovrai mandare quello nuovo. Procedere?"))return;o.token=randTok();
    if(document.querySelector("#sheet .owner-view")){const dog=Object.keys(D.dogs).find(k=>D.dogs[k].owner===v);closeSheet();render();dog&&ownerPreview(dog)}else render();saveNow();toast("Link privato pronto.")}
});
async function seedImport(file){const p=document.getElementById("seedProg");
  try{if(p)p.textContent="Leggo il file…";const o=JSON.parse(await file.text());if(!o.data||!o.files)throw new Error("non è il file dei dati iniziali");
    const keys=Object.keys(o.files);let i=0;
    for(const k of keys){const blob=await (await fetch(o.files[k])).blob();
      const r=await api("/api/import?file="+encodeURIComponent(k),{method:"POST",headers:{"content-type":blob.type},body:blob});
      if(!r.ok)throw new Error((await r.json()).error);i++;if(p)p.textContent=`Foto e documenti caricati: ${i} di ${keys.length}…`}
    if(p)p.textContent="Scrivo i dati…";const r=await api("/api/import",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(o.data)});
    if(!r.ok&&r.status!==409)throw new Error((await r.json()).error);if(p)p.textContent="Fatto.";await loadAll()}
  catch(err){if(p)p.textContent="Errore: "+err.message+". Riprova."}}
document.addEventListener("change",e=>{if(e.target.id==="seedFile"&&e.target.files[0])seedImport(e.target.files[0])});
let b0=null;
async function loadAll(){try{const r=await api("/api/data");const j=await r.json();
    if(j.role==="viewer"&&!RO){RO=true;window.RO=true;document.body.classList.add("ro");const i=TABS.findIndex(t=>t[0]==="proprietari");if(i>=0)TABS.splice(i,1);const isd=TABS.findIndex(t=>t[0]==="scadenze");if(isd>=0)TABS.splice(isd,1);if(tab==="scadenze")tab="cani";const ic=TABS.findIndex(t=>t[0]==="conti");if(ic>=0)TABS.splice(ic,1);if(tab==="conti")tab="cani";if(tab==="proprietari")tab="cani"}
    if(!j.data){EMPTY=true}else{EMPTY=false;Object.keys(D).forEach(k=>delete D[k]);Object.assign(D,j.data);D.matings=D.matings||{};VERSION=j.version;lastJ=JSON.stringify(D);SAVE.at=j.updated?new Date(j.updated).toLocaleString("it-IT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):null}
  }catch(err){SAVE.err=SAVE.err||"Non riesco a leggere i dati online: controlla la connessione e ricarica."}
  resetCalc();render();ctLoad();wlSync();try{if(scSync())saveNow()}catch(e){console.error(e)}}
/* Richieste dal modulo del sito → Lista d'attesa (una volta sola per richiesta) */
async function wlSync(){if(RO||EMPTY)return;try{const r=await api("/api/requests");if(!r.ok)return;const R=await r.json();D.waitlist=D.waitlist||[];const have=new Set(D.waitlist.map(w=>w.id));let n=0;
  R.forEach(q=>{if(have.has(q.rid))return;D.waitlist.push({id:q.rid,created:q.created,name:q.name,email:q.email,phone:q.phone,city:q.city,country:q.country,sex:q.sex,exp:q.exp,note:q.note,source:"sito",litter:"",status:"new",lang:/^(it|italia|italy)$/i.test(q.country||"")||!q.country?"it":"en"});n++});
  if(n){saveNow();if(tab==="attesa")render();toast(n===1?"1 nuova richiesta dal sito nella Lista d'attesa.":n+" nuove richieste dal sito nella Lista d'attesa.")}}catch(e){}}
/* Contratti firmati dai proprietari: li carico e salvo da solo il PDF nei documenti del cucciolo */
async function ctLoad(){let changed=false;try{const r=await api("/api/contracts");if(r.ok){CONTR=await r.json();window.CONTR=CONTR}}catch(e){return}
  for(const [id,G] of Object.entries(CONTR)){const d=D.dogs[id];if(!d||(d.docs||[]).some(x=>x.ct===G.hash))continue;
    try{const p=await ctPdf(G.snap,G.buyer,G,G.meSig);d.docs=d.docs||[];
      d.docs.push({title:"Contratto di cessione firmato",title_en:"Signed sale agreement",date:G.at.slice(0,10),file:"data:application/pdf;base64,"+btoa(p.output()),fname:ctFile(G.snap),private:false,ct:G.hash});changed=true}catch(e){console.error(e)}}
  render();if(changed)saveNow()}
render();loadAll();
