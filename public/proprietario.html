<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Del Piccolo Diavolo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEF1;--paper:#FFFFFF;--ink:#1C2230;--muted:#5C6472;--line:#D6DAE0;
  --accent:#8C2B23;--accent-soft:#F4E3E1;--ok:#2F6B3F;--ok-soft:#E1EEE4;--warn:#9A5B12;--warn-soft:#F6EAD8;
  --serif:"Young Serif",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171D;--paper:#1D2129;--ink:#E7E9ED;--muted:#9AA1AD;--line:#2F3541;
  --accent:#E07468;--accent-soft:#3A2220;--ok:#7CC48E;--ok-soft:#1E3326;--warn:#E3A55A;--warn-soft:#3A2C18;}}
:root[data-theme="dark"]{
  --bg:#14171D;--paper:#1D2129;--ink:#E7E9ED;--muted:#9AA1AD;--line:#2F3541;
  --accent:#E07468;--accent-soft:#3A2220;--ok:#7CC48E;--ok-soft:#1E3326;--warn:#E3A55A;--warn-soft:#3A2C18;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
main{min-width:0}
nav.side{background:var(--paper);border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh}
.brand{font-family:var(--serif);font-size:1.35rem;line-height:1.15;margin:0 0 4px}
.brand-sub{color:var(--muted);font-size:.85rem;margin:0 0 28px}
.navbtn{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;padding:10px 12px;border-radius:8px;text-align:left;color:var(--muted);font-weight:500}
.navbtn[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.navbtn svg{width:20px;height:20px;flex:none}
main{padding:28px clamp(16px,4vw,48px) 100px;max-width:1100px;width:100%}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(1.7rem,4vw,2.3rem);line-height:1.1;margin:0 0 6px}
h2{font-family:var(--serif);font-weight:400;font-size:1.3rem;margin:32px 0 12px}
.lead{color:var(--muted);margin:0 0 20px}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px;align-items:center}
.search{flex:1 1 220px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:.9rem;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.btn{border:0;background:var(--ink);color:var(--paper);border-radius:8px;padding:10px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:.9rem}

.list{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--bg)}
.row{align-items:center}
.pups{margin-top:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pups summary{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;list-style:none;font-weight:600}
.pups summary::-webkit-details-marker{display:none}
.pups summary span:first-child::after{content:"▾";display:inline-block;margin-left:8px;color:var(--muted);transition:transform .15s}
.pups[open] summary span:first-child::after{transform:rotate(180deg)}
.pups[open] summary{border-bottom:1px solid var(--line)}
.pups .list{border:0;border-radius:0}
.lnk{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:500;text-align:left;text-decoration:underline;text-underline-offset:2px}
.thumb{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--bg);flex:none}
.thumb.ph{display:grid;place-items:center;color:var(--muted);font-family:var(--serif)}
.rowwrap{display:flex;gap:12px;align-items:center;min-width:0}
.hero-photo{width:100%;max-width:420px;max-height:460px;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block;margin:0 0 16px}
.pcell img{width:100%;height:120px;object-fit:contain;background:var(--bg);border-radius:4px;margin:0 0 5px;display:block}
.photo-edit{display:flex;gap:12px;align-items:center}
.photo-edit img{width:72px;height:72px;object-fit:cover;border-radius:8px}
.row-name{font-family:var(--serif);font-size:1.08rem}
.row-meta{color:var(--muted);font-size:.88rem;grid-column:1}
.badge{font-size:.78rem;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--muted);align-self:start;white-space:nowrap}
.badge.f{background:var(--accent-soft);color:var(--accent)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}

.back{background:none;border:0;color:var(--muted);padding:0;margin:0 0 14px;font-weight:500}
.nick{color:var(--muted);font-size:1rem;margin:0 0 18px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 8px}
.fact{background:var(--paper);padding:12px 14px}
.fact dt{color:var(--muted);font-size:.8rem}
.fact dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.empty{color:var(--muted);font-style:italic;font-weight:400}
.note{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;white-space:pre-wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0}

.hero{display:grid;grid-template-columns:1fr minmax(160px,38%);gap:0;background:var(--ink);color:#fff;border-radius:16px;overflow:hidden;margin:0 0 16px;min-height:220px}
.hero-t{padding:26px 24px;display:flex;flex-direction:column;justify-content:flex-end}
.hero-k{margin:0;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.hero-h{font-family:var(--serif);font-weight:400;font-size:clamp(1.9rem,5vw,2.8rem);line-height:1.05;margin:6px 0 6px;color:#fff}
.hero-s{margin:0;opacity:.75}
.hero-p{position:relative}.hero-p img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
@media (max-width:560px){.hero{grid-template-columns:1fr;min-height:0}.hero-p{height:260px;order:-1}.hero-t{padding:18px}}
.lab{margin:0 0 4px;font-weight:600;font-size:.9rem}
.sx{display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--muted)}
.sx:focus-within{border-color:var(--ink)}
.sx input{flex:1;border:0;outline:0;background:none;padding:10px 0;font:inherit;color:var(--ink);min-width:0}
.fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.25);cursor:pointer;z-index:9}
.fab svg{width:26px;height:26px}
.fabl{position:absolute;right:66px;background:var(--ink);color:var(--paper);font-size:.85rem;padding:4px 10px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.fab:hover .fabl,.fab:focus-visible .fabl{opacity:1}
@media (max-width:760px){.fab{bottom:calc(84px + env(safe-area-inset-bottom,0px));right:16px}}
.row-par{display:block;font-size:.86rem;margin-top:2px;color:var(--ink)}
.row-par b{color:var(--muted);font-weight:400;margin:0 2px}
.row-par i,.row-par2 i{color:var(--muted)}
.row-par2{display:flex;flex-direction:column;gap:1px;margin-top:4px;font-size:.84rem}
.row-par2 span{padding-left:7px;border-left:3px solid var(--ink)}
.row-par2 .pf{border-left-color:var(--accent)}
.plink{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.plink:hover{color:var(--accent);text-decoration-color:currentColor}
.od-wrap{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;margin-top:4px}
.od-n{display:block;font-size:.92rem;color:var(--ink)}
.cb{position:relative}
.cbi{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font:inherit;font-size:1rem;color:var(--ink)}
.cbi:focus{outline:0;border-color:var(--accent)}
.cb .menu{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.15);max-height:280px;overflow:auto;z-index:30;display:none}
.cb .menu.open{display:block}
.cb .menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;font:inherit;font-size:.95rem;color:var(--ink);cursor:pointer}
.cb .menu button small{color:var(--muted);margin-left:6px}
.cb .menu button:hover,.cb .menu button.act{background:var(--bg)}
.cb .menu .add{border-top:1px solid var(--line);color:var(--accent);font-weight:600}
.cb .menu .clr{color:var(--muted);font-size:.85rem}
.cb-none{margin:0;padding:9px 12px;color:var(--muted);font-size:.9rem}
.tag{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:999px;background:var(--bg);color:var(--muted);margin-left:6px;vertical-align:1px}
.fnote{background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:.9rem;margin:-4px 0 14px}
.pmiss-box{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.pmiss{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.pmiss:first-of-type{border-top:0}
.pedf{min-width:880px}
.pedf .pcell.slot{background:var(--bg);border-style:dashed}
.pedf .sl{display:block;font-size:.75rem;color:var(--muted);margin:0 0 4px}
.pedf .cbi{padding:7px 9px;font-size:.9rem}
.sheet:has(.pedf){width:min(1000px,100%)}
.anc-h{font-family:var(--serif);font-weight:400;font-size:1.2rem;margin:18px 0 2px}.anc-h span{font-family:var(--sans);font-size:.85rem;color:var(--muted)}
.anc-list{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.anc-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.anc-row:first-child{border-top:0}
.anc-n{font-family:var(--serif);font-size:1.02rem;text-align:left}
.anc-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.anc-r{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.anc-c{font-family:var(--serif);font-size:1.35rem;line-height:1}
.anc-r a{font-size:.82rem;color:var(--accent);white-space:nowrap}
.hnext{background:var(--warn-soft);border-radius:10px;padding:10px 14px;margin:0 0 12px}
.hsec{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.hhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 6px}.hhead h3{margin:0;font-size:1rem}
.hrow{display:grid;grid-template-columns:100px 1fr auto;gap:10px;align-items:start;padding:7px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}.hd{color:var(--muted);font-size:.9rem}
.hrow small{display:block;color:var(--muted);margin-top:2px}.hrow small a{color:var(--accent)}
.hx{border:0;background:none;color:var(--muted);font-size:1.2rem;line-height:1;cursor:pointer;padding:0 4px}
.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.pv-ex{border:2px dashed var(--warn);background:var(--warn-soft);border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:.9rem}
.dna{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.dna-ok{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:8px 12px;margin:0 0 10px;font-weight:600;font-size:.92rem}
.dna-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.dna-c{display:flex;justify-content:space-between;gap:8px;background:var(--bg);border-radius:6px;padding:5px 9px;font-size:.85rem}
.dna-c span{color:var(--muted)}.dna-c b{font-weight:600;font-variant-numeric:tabular-nums}
.dna-pdf{color:var(--accent);font-weight:600}
.coi-empty .coi-num{color:var(--muted)}
.sbt-in input{width:90px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;margin-left:4px}
.coi2{display:flex;flex-direction:column;gap:2px;margin:8px 0 0;padding:8px 12px;border-left:3px solid var(--line);font-size:.92rem}
.pups,.pups *,.pups *::before,.pups *::after{box-sizing:border-box}
.rowwrap>span:last-child{min-width:0}
.row-name,.row-meta,.row-par2 span,.od-n{overflow-wrap:anywhere}
.row .badge{justify-self:end;max-width:100%}
.pups summary{flex-wrap:wrap}.pups summary span{min-width:0}
.hfab{position:fixed;right:90px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.25);cursor:pointer;z-index:9}
.hfab svg{width:24px;height:24px}.hfab .fabl{right:66px}
.hfab:hover .fabl,.hfab:focus-visible .fabl{opacity:1}
@media (max-width:760px){.hfab{bottom:calc(84px + env(safe-area-inset-bottom,0px));right:84px}}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:.92rem;opacity:0;pointer-events:none;transition:all .2s;z-index:40}
#toast.show{opacity:1;transform:translateX(-50%)}
.pd-h{margin:12px 0 6px;font-size:.92rem;color:var(--muted)}.pd-h strong{color:var(--ink)}
.banner .bn-act{display:inline-flex;gap:6px;flex-wrap:wrap;margin-left:6px;vertical-align:middle}
.banner .btn.small{padding:3px 10px;font-size:.82rem}
.fact-e{all:unset;display:flex;flex-direction:column;justify-content:flex-start;cursor:pointer;box-sizing:border-box;background:var(--paper);padding:12px 14px;text-align:left}
.fact-e .dt{display:block;color:var(--muted);font-size:.8rem}.fact-e .dd{display:block;margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.fact-e:hover{background:var(--bg)}.fact-e .pen{margin-left:6px;opacity:.35;vertical-align:-2px}
.fact-e:hover .pen{opacity:1;color:var(--accent)}
.ins{color:var(--accent);font-weight:600}
.editbox{background:var(--paper);border:2px solid var(--accent);border-radius:12px;padding:14px;margin:0 0 8px}
.edit-h{margin:0 0 12px;font-size:.9rem;color:var(--muted)}
.editbox .f>span{font-size:.88rem;color:var(--muted)}
.savebar{position:sticky;bottom:0;background:var(--paper);padding:10px 0 4px;margin:12px 0 0}
.btn.save{background:var(--accent);color:#fff;font-size:1.05rem;padding:12px 28px}
.facts .ins{border:0;background:none;padding:0;font:inherit;color:var(--accent);font-weight:600;cursor:pointer}
@media (max-width:760px){.savebar{bottom:calc(64px + env(safe-area-inset-bottom,0px))}}
.sx-ico{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}.sx-m{color:#1f6fd1}.sx-f{color:#d63384}
.newown{display:grid;gap:6px;margin-top:8px;padding:10px;border:1px dashed var(--line);border-radius:8px}
.newown input,.newown select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font:inherit}
.og-h{display:flex;flex-direction:column;gap:0;margin:22px 0 8px}.og-t{font-family:var(--serif);font-weight:400;font-size:1.15rem}
.og summary{flex-direction:column;align-items:flex-start;gap:2px}.og summary .og-t{font-weight:400}
.og{margin:0 0 10px}
.orow{grid-template-columns:minmax(0,1fr) auto;padding:10px 16px}.orow-l{display:flex;flex-direction:column;min-width:0}.ofull{color:var(--muted)}
.lyear{font-family:var(--serif);font-weight:400;font-size:1.05rem;color:var(--muted);margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.lyear::after{content:"";flex:1;height:1px;background:var(--line)}
.lcard{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.lplan{border-style:dashed;border-color:var(--warn);background:linear-gradient(0deg,var(--paper),var(--paper)),var(--warn-soft)}
.lhead{display:flex;align-items:center;gap:14px}
.lpics{display:flex;flex:none}.lpic{width:58px;height:58px;border-radius:50%;overflow:hidden;border:3px solid var(--paper);box-shadow:0 0 0 2px var(--accent);background:var(--bg);display:grid;place-items:center;font-family:var(--serif);color:var(--muted)}
.lpic.m{box-shadow:0 0 0 2px var(--ink);margin-left:-14px}.lpic img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.ltit{flex:1;min-width:0}.lnames{font-family:var(--serif);font-size:1.18rem;line-height:1.25}.lnames .plink{text-decoration:none}.lx{color:var(--accent);margin:0 2px}
.ldate{color:var(--muted);font-size:.9rem;margin-top:2px}.lstate{align-self:flex-start}
.lchips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.lchip{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border-radius:999px;padding:5px 12px;font-size:.88rem}
.lchip.ok{background:var(--ok-soft);color:var(--ok)}.lchip.coi-ok{background:var(--ok-soft);color:var(--ok)}.lchip.coi-warn{background:var(--warn-soft);color:var(--warn)}.lchip.coi-low{background:var(--bg)}
.lnotes{margin:10px 0 0;color:var(--muted);font-size:.9rem}
.lpups{margin-top:12px}
.lv-B{position:relative;padding-left:26px;border-left:3px solid var(--line);margin-left:8px}
.lv-B .lcard{position:relative}.lv-B .lcard::before{content:"";position:absolute;left:-36px;top:28px;width:15px;height:15px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.lv-B .lplan::before{background:var(--warn)}.lv-B .lyear{margin-left:-26px}
@media (max-width:560px){.lpic{width:46px;height:46px}.lnames{font-size:1.05rem}.lstate{display:none}}
.ownlink{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:14px 0 0}
.ownlink input{width:100%;margin:8px 0;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:.85rem;background:var(--bg)}
.owner-mode nav.side,.owner-mode nav.bottom,.owner-mode .hfab,.owner-mode #main>.lead,.owner-mode #main>.actions,.owner-mode .ownlink{display:none!important}
.owner-mode .app{grid-template-columns:minmax(0,1fr)}.owner-mode main{margin:0 auto;max-width:900px}
.owner-mode .owner-view{border:0;padding:0;background:none}
/* Pedigree: l'elemento forte */
.ped-wrap{overflow-x:auto;padding-bottom:6px;margin:0 -4px}
.ped{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:0 18px;min-width:760px;padding:0 4px}
.ped-col{display:flex;flex-direction:column;justify-content:space-around;gap:6px}
.pcell{position:relative;background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:6px;padding:7px 10px;font-size:.88rem;line-height:1.25;text-align:left;width:100%;min-height:40px}
.pcell.m{border-left-color:var(--ink)}
.pcell.fe{border-left-color:var(--accent)}
.pcell.unk{color:var(--muted);font-style:italic;border-style:dashed;border-left-width:1px}
.pcell.rep{background:var(--warn-soft)}

.ca-box{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}

.ca-h{font-family:var(--serif);font-size:1.05rem;margin:0 0 6px}
.ca-sub{color:var(--muted);font-size:.86rem;margin:0;font-variant-numeric:tabular-nums}
.ca-big{font-family:var(--serif);font-size:clamp(2.8rem,9vw,3.6rem);line-height:.95}.ca-big small{font-size:.45em;margin-left:2px}
.ca-cap{color:var(--ink);font-size:.86rem;font-weight:600;margin-top:6px}
.ca-scale{position:relative;height:56px;margin:18px 4px 6px}
.ca-track{position:absolute;left:0;right:0;top:22px;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--ok-soft),var(--bg) 45%,var(--warn-soft))}

.ca-anc .n{font-family:var(--serif)}.ca-anc .x{color:var(--muted);font-size:.85rem;text-align:right;white-space:nowrap}.ca-anc .x b{color:var(--ink);font-weight:600}

.owner-view .ov-top{color:var(--muted);font-size:.85rem;margin:0 0 6px}

.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:.9rem;margin:0 0 20px}

nav.bottom{display:none}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav.side{display:none}
  nav.bottom{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:6px 4px env(safe-area-inset-bottom,0px);z-index:10}
  nav.bottom .navbtn{flex-direction:column;gap:2px;font-size:.72rem;padding:6px 2px;justify-content:center;text-align:center}
  .mate,.form{grid-template-columns:1fr}

}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}

<body class="owner-mode">
<div class="app">
  <nav class="side" aria-label="Sezioni">
    <p class="brand">Del Piccolo Diavolo</p>
    <p class="brand-sub">Gestionale allevamento</p>
    <div id="navSide"></div>
  </nav>
  <main id="main"></main>
</div>
<button class="hfab" data-a="qh" aria-label="Vaccino, sverminazione o esame"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2l4 4M17 7l3-3M19 9l-8.7 8.7a2 2 0 0 1-2.8 0l-2.2-2.2a2 2 0 0 1 0-2.8L14 4M9 11l4 4M5 19l-3 3M14 4l6 6"/></svg><span class="fabl">Vaccino · sverminazione · esame</span></button>
<nav class="bottom" id="navBottom" aria-label="Sezioni"></nav>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
/* ---------- Gestionale online: i dati arrivano dal database ---------- */
const D={dogs:{},owners:{},litters:{},matings:{}};
const FILES={},DOCF={};
const OWNER_MODE=true;
/* ---------- Utilità ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>d?new Date(d+"T12:00").toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric"}):"";
const dn=id=>id&&D.dogs[id]?D.dogs[id].name:"";
const newId=p=>p+Math.random().toString(36).slice(2,8);
const STATUS={fattrice:["Fattrice","f"],stallone:["Stallone","f"],casa:["In casa",""],prenotato:["Prenotato","warn"],ceduto:["Ceduto","ok"],sterilizzata:["Sterilizzata",""],deceduto:["Deceduto",""]};

/* ---------- COI (formula di Wright, coefficiente di parentela) ---------- */
let kinMemo={},genMemo={};
function resetCalc(){kinMemo={};genMemo={};coiMemo={}}
/* COI dei cuccioli con il metodo di Wright, limitato a 8 generazioni come SBTPedigree */
const COI_GEN=8;let coiMemo={};
function routes(start,maxd){const out=[],st=[[start,1,[start]]];
  while(st.length){const [id,d,path]=st.pop();const x=D.dogs[id];if(!x)continue;out.push({a:id,d,path});
    if(d<maxd){if(x.sire)st.push([x.sire,d+1,path.concat(x.sire)]);if(x.dam)st.push([x.dam,d+1,path.concat(x.dam)])}}
  return out}
function coi8(s,d){if(!s||!d||!D.dogs[s]||!D.dogs[d])return 0;const key=s+"|"+d;if(key in coiMemo)return coiMemo[key];coiMemo[key]=0;
  const R2=routes(d,COI_GEN),by={};R2.forEach(r=>(by[r.a]=by[r.a]||[]).push(r));let t=0;
  for(const r of routes(s,COI_GEN)){const L=by[r.a];if(!L)continue;const A=D.dogs[r.a],FA=coi8(A.sire,A.dam),set=new Set(r.path.slice(0,-1));
    for(const q of L){if(q.path.slice(0,-1).some(x=>set.has(x)))continue;t+=Math.pow(.5,r.d+q.d-1)*(1+FA)}}
  return coiMemo[key]=t}
function gen(id){if(!id||!D.dogs[id])return -1;if(id in genMemo)return genMemo[id];genMemo[id]=0;const d=D.dogs[id];return genMemo[id]=1+Math.max(gen(d.sire),gen(d.dam))}
function F(id){const d=D.dogs[id];return d?coi8(d.sire,d.dam):0}
function kin(a,b){
  if(!a||!b||!D.dogs[a]||!D.dogs[b])return 0;
  if(a===b)return .5*(1+F(a));
  if(gen(a)<gen(b))[a,b]=[b,a];
  const k=a+"|"+b;if(k in kinMemo)return kinMemo[k];
  const d=D.dogs[a];return kinMemo[k]=.5*(kin(d.sire,b)+kin(d.dam,b));
}
function ancestors(id,depth){ // array per generazione
  const out=[];let cur=[id];
  for(let g=0;g<depth;g++){const nx=[];cur.forEach(x=>{const d=x&&D.dogs[x];nx.push(d?d.sire||null:null,d?d.dam||null:null)});out.push(nx);cur=nx}
  return out;
}
function coverage(sire,dam,depth=8){ // antenati noti su 8 generazioni, come SBT
  let known=0,tot=0;
  [sire,dam].forEach(p=>{tot++;if(p)known++;ancestors(p,depth-1).forEach(g=>g.forEach(x=>{tot++;if(x)known++}))});
  return {known,tot};
}
function commonAnc(s,d,depth=7){
  const a=new Set([s,...ancestors(s,depth).flat()].filter(Boolean));
  return [...new Set([d,...ancestors(d,depth).flat()].filter(x=>x&&a.has(x)))];
}
function band(p){
  if(p<6)return["Sotto la tua fascia ideale (6–9%)",""];
  if(p<=9)return["Dentro la tua fascia ideale (6–9%)","ok"];
  return["Sopra la tua fascia ideale (6–9%)","warn"];
}

/* ---------- Navigazione ---------- */
const TABS=[
 ["cani","Cani",'<path d="M5 11c0-3 2-6 7-6s7 3 7 6v5a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z"/><circle cx="9.5" cy="12" r=".9" fill="currentColor"/><circle cx="14.5" cy="12" r=".9" fill="currentColor"/>'],
 ["cucciolate","Cucciolate",'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>'],
 ["proprietari","Proprietari",'<circle cx="12" cy="9" r="3.5"/><path d="M5 20c1-4 4-5.5 7-5.5s6 1.5 7 5.5"/>'],
 ["coi","Accoppiamenti",'<circle cx="8" cy="12" r="4.5"/><circle cx="16" cy="12" r="4.5"/>']
];
let tab="cani",view=null,filter="miei",q="";
function nav(){
  const h=TABS.map(([k,l,ic])=>`<button class="navbtn" aria-current="${tab===k}" data-a="go" data-v="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">${ic}</svg>${l}</button>`).join("");
  $("#navSide").innerHTML=h;$("#navBottom").innerHTML=h;
}
let EDIT=null,EDIRTY=false;
document.addEventListener("input",e=>{if(e.target.closest&&e.target.closest(".editbox"))EDIRTY=true});document.addEventListener("change",e=>{if(e.target.closest&&e.target.closest(".editbox"))EDIRTY=true});
function leaveOk(){if(!EDIT)return true;if(EDIRTY&&!confirm("Hai cambiato dei dati senza premere Salva.\n\nOK = esci e lascia perdere le modifiche\nAnnulla = resta qui per salvarle"))return false;EDIT=null;EDIRTY=false;return true}
function go(t){if(!leaveOk())return;tab=t;view=null;render();scrollTo(0,0)}
function openItem(id){if(!leaveOk())return;if(D.dogs[id]&&!(tab==="proprietari"&&D.owners[id]))tab="cani";view=id;render();scrollTo(0,0)}
function render(){resetCalc();nav();
  const m=$("#main");
  const banner=bannerHtml();
  if(tab==="cani")m.innerHTML=banner+(view?dogDetail(view):dogList());
  if(tab==="cucciolate")m.innerHTML=banner+litterList();
  if(tab==="proprietari")m.innerHTML=banner+(view?ownerDetail(view):ownerList());
  if(tab==="coi")m.innerHTML=banner+mating();
  if(tab==="coi")calcMate();
}

/* ---------- Cani ---------- */
function curLitter(){
  const ls=Object.entries(D.litters).filter(([,l])=>l.state==="nata"&&l.date).sort((a,b)=>a[1].date<b[1].date?1:-1);
  return ls.length?ls[0][0]:null;
}
function pupFold(ids,label){
  const lid=curLitter();if(!lid)return["",ids];
  const pups=ids.filter(k=>D.dogs[k].litter===lid);
  if(pups.length<2)return["",ids];
  pups.sort((a,b)=>D.dogs[a].name.localeCompare(D.dogs[b].name,"it",{numeric:true}));
  const l=D.litters[lid];
  const box=`<details class="pups"><summary><span>${label} · ${esc(dn(l.dam))} × ${esc(dn(l.sire))}</span><span class="row-meta">nata il ${fmt(l.date)} · ${pups.length} cuccioli (${pupSummary(pups)})</span></summary><div class="list">${rows(pups)}</div></details>`;
  return[box,ids.filter(k=>!pups.includes(k))];
}
const HERO="bilquis";
function isMine(d){return !d.ext&&(d.fattr||d.status!=="ceduto"&&d.status!=="prenotato")}
function hero(){const d=D.dogs[HERO];
  return `<div class="hero"><div class="hero-t"><p class="hero-k">Staffordshire Bull Terrier</p><h1 class="hero-h">Del Piccolo Diavolo</h1><p class="hero-s">Gestionale allevamento</p></div>
  <div class="hero-p">${d&&d.photo?`<img src="${d.photo}" alt="">`:""}</div></div>`;
}
/* Cani raggruppati per cucciolata (usato per i Ceduti): dalla più recente, dentro ogni gruppo in ordine alfabetico */
function litterGroups(ids){const g={};
  ids.forEach(k=>{const d=D.dogs[k];const key=d.litter&&D.litters[d.litter]?"L:"+d.litter:(d.sire||d.dam)?"P:"+(d.sire||"")+"|"+(d.dam||""):"Z";(g[key]=g[key]||[]).push(k)});
  const gd=key=>key.startsWith("L:")?(D.litters[key.slice(2)].date||""):key==="Z"?"":(g[key].map(k=>D.dogs[k].birth||(D.dogs[k].year?D.dogs[k].year+"-01-01":"")).sort().pop()||"");
  return Object.keys(g).sort((a,b)=>a==="Z"?1:b==="Z"?-1:gd(b).localeCompare(gd(a))).map(key=>{
    const L=g[key].sort((a,b)=>D.dogs[a].name.localeCompare(D.dogs[b].name,"it",{numeric:true}));
    const [s,dm]=key.startsWith("L:")?[D.litters[key.slice(2)].sire,D.litters[key.slice(2)].dam]:key==="Z"?["",""]:key.slice(2).split("|");const dt=gd(key);
    const t=key==="Z"?"Senza genitori inseriti":`${esc(dn(dm)||"madre ?")} × ${esc(dn(s)||"padre ?")}`;
    const sub=key==="Z"?`${L.length} ${L.length===1?"cane":"cani"}`:`${dt?(key.startsWith("L:")?"cucciolata del ":"nati il ")+fmt(dt):"data da inserire"} · ${L.length} ${L.length===1?"cane":"cani"}`;
    return `<h2 class="og-h"><span class="og-t">${t}</span><span class="row-meta">${sub}</span></h2><div class="list">${rows(L)}</div>`}).join("")}
function dogList(){
  const f=[["miei","Miei"],["ceduto","Ceduti"],["prenotato","Prenotati"],["tutti","Tutti"],["fattrice","Fattrici"],["ext","Esterni"]];
  let ids=Object.keys(D.dogs).filter(id=>{const d=D.dogs[id];
    if(q&&!(d.name+" "+(d.nick||"")+" "+(d.loi||"")+" "+(d.chip||"")).toLowerCase().includes(q.toLowerCase()))return false;
    if(filter==="miei")return isMine(d);
    if(filter==="ext")return d.ext;
    if(filter==="fattrice")return d.status==="fattrice"||d.fattr;
    if(filter!=="tutti")return d.status===filter;return true});
  ids.sort((a,b)=>D.dogs[a].name.localeCompare(D.dogs[b].name));
  let body;
  if(filter==="ceduto"&&ids.length)body=`<div id="dogrows">${litterGroups(ids)}</div>`;
  else{const [fold,rest]=q?["",ids]:pupFold(ids,"Cucciolata attuale");
    body=`${fold?`<div style="margin:0 0 12px">${fold}</div>`:""}<div class="list" id="dogrows">${rows(rest)}</div>`}
  return `${hero()}
  <p class="lab">Cerca</p><label class="sx"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input placeholder="Nome, soprannome, LOI o microchip" value="${esc(q)}" id="srch"></label>
  <button class="fab" data-a="dogForm" aria-label="Nuovo cane"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="fabl">Nuovo cane</span></button>
  <div class="toolbar" style="margin-top:12px">${f.map(([k,l])=>`<button class="chip" aria-pressed="${filter===k}" data-a="filter" data-v="${k}">${l}</button>`).join("")}</div>
  <p class="row-meta" style="margin:0 0 10px">${Object.keys(D.dogs).length} cani in archivio, compresi antenati e stalloni esterni.</p>
  ${body}`;
}
function sbtLink(d){
  if(d.sbt)return `<a href="https://sbtpedigree.com/dog_details?dogs_id=${encodeURIComponent(d.sbt)}" target="_blank" rel="noopener" style="color:var(--accent)">Apri su SBTPedigree ↗</a>`;
  return `<a href="https://www.google.com/search?q=${encodeURIComponent('site:sbtpedigree.com "'+d.name+'"')}" target="_blank" rel="noopener" style="color:var(--accent)">Cerca su SBTPedigree ↗</a> <span class="empty">· link diretto da inserire in “Modifica”</span>`;
}
function thumb(d){return d.photo?`<img class="thumb" src="${d.photo}" alt="">`:`<span class="thumb ph" aria-hidden="true">${esc((d.nick||d.name).trim()[0]||"")}</span>`}
function born(d){return d.birth?fmt(d.birth):(d.year?"nato nel "+d.year:"")}
function rows(ids){
  if(!ids.length)return '<div class="row"><span class="row-meta">Nessun cane con questi criteri. Cambia filtro o aggiungine uno.</span></div>';
  return ids.map(id=>{const d=D.dogs[id];const st=d.ext?["Esterno",""]:STATUS[d.status]||["",""];
    const meta=[d.nick&&esc("“"+d.nick+"”"),sexH(d.sex),esc(born(d)),d.owner&&D.owners[d.owner]&&esc("di "+D.owners[d.owner].name)].filter(Boolean).join(", ");
    const showP=(d.sire||d.dam)&&!d.ext;
    const pn=k=>k&&D.dogs[k]?esc(D.dogs[k].name):'<i>non inserito</i>';
    const par=!showP?"":`<span class="row-par2"><span class="pm">${pn(d.sire)}</span><span class="pf">${pn(d.dam)}</span></span>`;
    return `<button class="row" data-a="open" data-v="${id}"><span class="rowwrap">${thumb(d)}<span><span class="row-name" style="display:block">${esc(d.name)}</span><span class="row-meta">${meta||"&nbsp;"}</span>${par}</span></span>${st[0]?`<span class="badge ${st[1]}">${st[0]}</span>`:"<span></span>"}</button>`}).join("");
}
function rerenderList(){const s=$("#srch"),p=s.selectionStart;$("#main").innerHTML=bannerHtml()+dogList();const n=$("#srch");n.focus();n.setSelectionRange(p,p)}

function fact(l,v){return `<div class="fact"><dt>${l}</dt><dd>${v?esc(v):`<span class="empty">${T("da inserire","not yet available")}</span>`}</dd></div>`}

function pedigree(id){
  const gens=ancestors(id,4);
  const all=gens.flat().filter(Boolean),cnt={};all.forEach(x=>cnt[x]=(cnt[x]||0)+1);
  const rep=Object.keys(cnt).filter(k=>cnt[k]>1);
  const labels=["Genitori","Nonni","Bisnonni","Trisavoli"];
  return `<div class="ped-wrap"><div class="ped">${gens.map((g,i)=>`<div class="ped-col" aria-label="${labels[i]}">${g.map((x,j)=>{
    if(!x)return `<div class="pcell unk">${j%2?"Madre sconosciuta":"Padre sconosciuto"}</div>`;
    const d=D.dogs[x];
    return `<button class="pcell ${d.sex==="F"?"fe":"m"} ${rep.includes(x)?"rep":""}" data-a="open" data-v="${x}">${d.photo&&i<3?`<img src="${d.photo}" alt="">`:""}<span class="pn">${esc(d.name)}</span>${d.loi?`<small>${esc(d.loi)}</small>`:""}</button>`}).join("")}</div>`).join("")}</div></div>
  <p class="ped-legend">${T("Quattro generazioni, scorri di lato sul telefono.","Four generations; on a phone, scroll sideways.")} ${rep.length?'<span></span>'+T("Cani che compaiono più volte.","Dogs appearing more than once."):""}</p>`;
}

    nx.push({id:d?d.sire||null:null,child:c.id,side:"s"},{id:d?d.dam||null:null,child:c.id,side:"d"})});out.push(nx);cur=nx}
  return out}

let LV="B";
function litterList(){
  const ls=Object.entries(D.litters).sort((a,b)=>{const pa=a[1].state==="pianificata",pb=b[1].state==="pianificata";if(pa!==pb)return pa?-1:1;return (b[1].date||"").localeCompare(a[1].date||"")});

  return `<button class="back" data-a="back">‹ Tutti i proprietari</button><h1>${esc(o.name)}</h1><p class="nick">${esc(o.country||"")}</p>
  ${EDIT==="own:"+id?`<div class="editbox"><p class="edit-h">Stai modificando i dati: niente viene salvato finché non premi <strong>Salva</strong>.</p><div class="form">
  <label class="f full">Nome<input id="eo_name" value="${esc(o.name)}"></label><label class="f">Paese<input id="eo_country" value="${esc(o.country||"")}"></label>
  <label class="f">Telefono<input id="eo_phone" type="tel" value="${esc(o.phone||"")}"></label><label class="f">Email<input id="eo_email" type="email" value="${esc(o.email||"")}"></label>
  <label class="f">Indirizzo<input id="eo_addr" value="${esc(o.addr||"")}"></label><label class="f">Lingua della pagina privata<select id="eo_lang"><option value="it" ${o.lang!=="en"?"selected":""}>Italiano</option><option value="en" ${o.lang==="en"?"selected":""}>English</option></select></label>
  <label class="f full">Note<textarea id="eo_notes" rows="3">${esc(o.notes||"")}</textarea></label></div>
  <div class="actions savebar"><button class="btn save" data-a="ownSave" data-v="${id}">Salva</button><button class="btn ghost" data-a="editCancel">Annulla modifiche</button></div></div>`
 :`<dl class="facts">${[["Paese",o.country],["Telefono",o.phone],["Email",o.email],["Indirizzo",o.addr],["Lingua pagina",o.lang==="en"?"English":"Italiano"]].map(([l,x])=>`<div class="fact"><dt>${l}</dt><dd>${x?esc(x):`<span class="empty">da inserire</span>`}</dd></div>`).join("")}</dl>`}
  <h2>Cani</h2>${dogs.length?`<div class="list">${rows(dogs)}</div>`:'<p class="empty">Nessun cane collegato.</p>'}
  ${o.notes?`<h2>Note</h2><div class="note">${esc(o.notes)}</div>`:""}
  ${EDIT==="own:"+id?"":ownLink(id)+`<div class="actions"><button class="btn" data-a="ownEdit" data-v="${id}">Modifica</button></div>`}`;
}
function ownerForm(id){
  const o=id?D.owners[id]:{};
  sheet(`<h2 style="margin-top:0">${id?"Modifica proprietario":"Nuovo proprietario"}</h2><div class="form">
  <label class="f full">Nome<input id="on" value="${esc(o.name)}"></label>
  <label class="f">Paese<input id="oc" value="${esc(o.country)}"></label>
  <label class="f">Telefono<input id="op" type="tel" value="${esc(o.phone)}"></label>
  <label class="f">Email<input id="oe" type="email" value="${esc(o.email)}"></label>
  <label class="f">Indirizzo<input id="oa" value="${esc(o.addr)}"></label>
  <label class="f">Lingua della pagina privata<select id="olang"><option value="it" ${o.lang!=="en"?"selected":""}>Italiano</option><option value="en" ${o.lang==="en"?"selected":""}>English</option></select></label>
  <label class="f full">Note<textarea id="ono" rows="3">${esc(o.notes)}</textarea></label></div>
  <div class="actions"><button class="btn" data-a="saveOwner" data-v="${id||""}">Salva proprietario</button><button class="btn ghost" data-a="close">Annulla</button></div>`);
}
function saveOwner(id){
  const name=$("#on").value.trim();if(!name){$("#on").focus();return}
  const nid=id||newId("o");
  D.owners[nid]={name,country:$("#oc").value.trim(),phone:$("#op").value.trim(),email:$("#oe").value.trim(),addr:$("#oa").value.trim(),notes:$("#ono").value.trim(),lang:$("#olang").value};
  closeSheet();tab="proprietari";view=nid;render();
}

/* ---------- Accoppiamento di prova ---------- */
let mateS="forever",mateD="queen";
function mating(){
  return `<h1>Accoppiamento di prova</h1><p class="lead">Scrivi o scegli maschio e femmina: il COI dei cuccioli si calcola prima di farlo. Se un cane non c’è, lo aggiungi da qui.</p>
  <div class="mate"><div class="f"><span>Maschio</span>${combo("ms","M",mateS)}</div>
  <div class="f"><span>Femmina</span>${combo("md","F",mateD)}</div></div>
  <div id="mateOut"></div>
  <p class="lead" style="margin-top:24px">Pedigree dei tuoi cani ancora incompleti? <button class="btn ghost small" data-a="loadDemo">Carica un esempio didattico</button></p>`;
}
function gensOf(root,x,depth=7){const g=[];if(root===x)g.push(1);ancestors(root,depth).forEach((c,i)=>c.forEach(y=>{if(y===x)g.push(i+2)}));return g}
function ancList(com){if(!com.length)return '<p class="row-meta">Nessun antenato in comune fra quelli inseriti.</p>';
  const ord=n=>n+"ª";
  const items=com.map(x=>{const a=gensOf(mateS,x),b=gensOf(mateD,x);return{x,a,b,n:a.length+b.length,min:Math.min(...a,...b)}})
    .sort((p,q)=>q.n-p.n||p.min-q.min||dn(p.x).localeCompare(dn(q.x)));
  return `<h3 class="anc-h">Antenati in comune <span>${items.length}</span></h3><p class="row-meta" style="margin:0 0 8px">Generazioni contate dai cuccioli: 1ª = genitori, 2ª = nonni, 3ª = bisnonni…</p>
  <div class="anc-list">${items.map(({x,a,b,n})=>{const d=D.dogs[x];
    return `<div class="anc-row">${thumb(d)}<div class="anc-t"><button class="plink anc-n" data-a="open" data-v="${x}">${esc(d.name)}</button>
    <span class="row-meta">Lato padre: ${a.map(ord).join(", ")} gen. · Lato madre: ${b.map(ord).join(", ")} gen.</span></div>
    <div class="anc-r"><span class="anc-c" title="Volte nel pedigree">${n}×</span>${d.sbt?`<a href="https://sbtpedigree.com/dog_details?dogs_id=${encodeURIComponent(d.sbt)}" target="_blank" rel="noopener">SBT ↗</a>`:""}</div></div>`}).join("")}</div>`}
const pc=v=>v?parseFloat(String(v).replace(",",".")):NaN;
const pf=n=>n.toFixed(2).replace(".",",");
function mateSbt(s,d){const m=D.matings&&D.matings[s+"|"+d];return m&&m.coiSbt?pc(m.coiSbt):NaN}
function setMateSbt(v){D.matings=D.matings||{};const k=mateS+"|"+mateD;const t=v.trim().replace("%","");
  if(t&&isNaN(pc(t)))return;D.matings[k]=Object.assign(D.matings[k]||{},{coiSbt:t});calcMate()}
function calcMate(){
  const o=$("#mateOut");if(!o)return;
  if(!mateS||!mateD){o.innerHTML='<p class="empty">Scegli entrambi i cani.</p>';return}
  const c=coi8(mateS,mateD)*100,cov=coverage(mateS,mateD),b=band(c),com=commonAnc(mateS,mateD);
  const miss=[mateS,mateD].map(k=>{const c=pedCount(k);return `<div class="pmiss"><span><strong>${esc(dn(k))}</strong> · antenati inseriti ${c.k} di ${c.t}</span>${c.k<c.t?`<button class="btn ${c.k<c.t/2?"":"ghost"} small" data-a="pedForm" data-v="${k}">Completa il pedigree</button>`:'<span class="badge ok">Completo</span>'}</div>`}).join("");
  const sb=mateSbt(mateS,mateD),hs=!isNaN(sb),bs=hs?band(sb):null,m=(D.matings||{})[mateS+"|"+mateD]||{};
  o.innerHTML=`<div class="coi ${hs?"":"coi-empty"}"><div class="coi-num">${hs?pf(sb)+"%":"—"}</div>
   <div class="coi-band">${hs?`<span class="badge ${bs[1]}">${bs[0]}</span>`:'<span class="badge">COI SBT non ancora inserito</span>'}</div>
   <div class="coi-cov"><strong>COI 8 generazioni SBT</strong> (test mating) · <label class="sbt-in">valore: <input id="mateSbt" inputmode="decimal" placeholder="es. 6,17" value="${esc(m.coiSbt||"")}">%</label></div></div>
   <div class="coi2"><span>Calcolo del gestionale (Wright, 8 generazioni): <strong>${pf(c)}%</strong></span><span class="row-meta">Antenati noti ${cov.known} di ${cov.tot}. Di solito un po' più basso di SBT, che usa il suo database completo.</span></div>
   <div class="anc">${ancList(com)}</div>
   <div class="pmiss-box"><strong>Per un COI affidabile servono gli antenati di entrambi (4 generazioni):</strong>${miss}</div>`;
}
function loadDemo(){
  if(D.dogs.ex_cap){mateS="ex_x";mateD="ex_y";render();return}
  const add=(id,name,sex,sire,dam)=>D.dogs[id]={name:"Esempio · "+name,sex,sire,dam,ext:true};
  add("ex_cap","Capostipite","M");add("ex_m1","Madre 1","F");add("ex_m2","Madre 2","F");
  add("ex_a","Figlio A","M","ex_cap","ex_m1");add("ex_b","Figlia B","F","ex_cap","ex_m2");
  add("ex_x2","Femmina esterna","F");add("ex_y2","Maschio esterno","M");
  add("ex_x","Maschio X","M","ex_a","ex_x2");add("ex_y","Femmina Y","F","ex_y2","ex_b");
  mateS="ex_x";mateD="ex_y";render();
  setTimeout(()=>alert("Esempio caricato: X e Y sono figli di due mezzi fratelli (stesso padre). Prova anche Figlio A × Figlia B."),50);
}


/* ---------- Comandi (senza codice inline, funziona in ogni visualizzatore) ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el||el.disabled)return;
  const a=el.dataset.a,v=el.dataset.v||"";
  switch(a){
    case "close":closeSheet();break;
    case "cancelDog":cancelSheet();break;
    case "pedDone":cancelSheet();break;
    case "pedForm":pedForm(v);break;
    case "back":view=null;render();break;
    case "open":closeSheet();openItem(v);break;
    case "openDog":tab="cani";openItem(v);break;
    case "openOwner":tab="proprietari";openItem(v);break;
    case "openLitterDog":tab="cani";openItem(v);break;
    case "go":go(v);break;
    case "filter":filter=v;render();break;
    case "dogForm":dogForm(v||undefined);break;
    case "saveDog":saveDog(v);break;
    case "ownerForm":ownerForm(v||undefined);break;
    case "saveOwner":saveOwner(v);break;
    case "ownerPreview":ownerPreview(v);break;
    case "ovLang":{const [i,l]=v.split("|");ownerPreview.lang=ownerPreview.lang||{};ownerPreview.lang[i]=l;ownerPreview(i);break}
    case "hForm":hForm(v);break;
    case "hSave":hSave(v);break;
    case "qh":qh(v||"");break;
    case "qhK":QH.k=v;QH.target=$("#qht").value;qhRender();break;
    case "qhSave":qhSave();break;
    case "edf":edf(v);break;
    case "editOn":editOn(v);break;
    case "editSave":editSave(v);break;
    case "editCancel":EDIT=null;EDIRTY=false;render();toast("Modifiche annullate: nulla è stato cambiato.");break;
    case "ownEdit":EDIT="own:"+v;EDIRTY=false;render();setTimeout(()=>{const b=document.querySelector(".editbox");b&&b.scrollIntoView({block:"start",behavior:"smooth"})},50);break;
    case "ownSave":ownSave(v);break;
    case "edfSave":edfSave(v);break;
    case "docForm":docForm(v);break;
    case "docSave":docSave(v);break;
    case "docDel":docDel(v);break;
    case "hDel":hDel(v);break;
    case "litterForm":litterForm();break;
    case "saveLitter":saveLitter();break;
    case "loadDemo":loadDemo();break;
    case "rmPhoto":tmpPhoto="";$("#fphPrev").innerHTML='<span class="thumb ph" style="width:72px;height:72px;border-radius:8px">?</span>';break;
    case "mate":{const d=D.dogs[v];if(d.sex==="M")mateS=v;else mateD=v;tab="coi";view=null;render();break}
    case "mateWith":{const [s1,d1]=v.split("|");mateS=s1;mateD=d1;tab="coi";view=null;render();break}
  }
});
document.addEventListener("input",e=>{if(e.target.id==="srch"){q=e.target.value;rerenderList()}});
document.addEventListener("change",e=>{if(e.target.id==="mateSbt")setMateSbt(e.target.value)});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="fph")pickPhoto(t);
  if(t.id==="ms"){mateS=t.value;calcMate()}
  if(t.id==="md"){mateD=t.value;calcMate()}
});

/* ---------- Sheet ---------- */
function sheet(h){$("#sheet").innerHTML=h;$("#sheetBg").classList.add("open");const f=$("#sheet input,#sheet button");f&&f.focus()}
function closeSheet(){$("#sheetBg").classList.remove("open")}
$("#sheetBg").addEventListener("click",e=>{if(e.target.id==="sheetBg")cancelSheet()});
addEventListener("keydown",e=>{if(e.key==="Escape")cancelSheet()});


/* ---------- Pagina privata del proprietario ---------- */
function bannerHtml(){return ""}
function ownLink(){return ""}
(async()=>{const m=document.getElementById("main");
  const tok=location.pathname.split("/").filter(Boolean).pop()||"";
  let j=null;try{const r=await fetch("/api/public/"+encodeURIComponent(tok));if(r.ok)j=await r.json()}catch(e){}
  if(!j){m.innerHTML=`<h1>Pagina non disponibile</h1><p class="lead">Il link non è valido oppure è stato sostituito. Chiedi all'allevatore il link aggiornato.<br><em>This link is not valid or has been replaced: please ask the breeder for the new one.</em></p>`;return}
  Object.assign(D,j.data);resetCalc();
  const en=(D.owners[j.owner]||{}).lang==="en";document.documentElement.lang=en?"en":"it";
  if(!j.dogs.length){m.innerHTML=en?"<h1>No dogs yet</h1>":"<h1>Nessun cane collegato</h1>";return}
  let html="";sheet=h=>{html+=`<section class="ov-dog">${h}</section>`};closeSheet=()=>{};
  j.dogs.forEach(id=>ownerPreview(id));m.innerHTML=html;
  document.title=(j.dogs.length===1?D.dogs[j.dogs[0]].name+" · ":"")+"Del Piccolo Diavolo";
  m.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&b.dataset.a!=="ovLang"){e.stopPropagation()}},true)})();

</script>
