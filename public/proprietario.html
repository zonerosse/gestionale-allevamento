/* ---------- Accoppiamento di prova ---------- */
let mateS="forever",mateD="queen";
function mateFemales(){return Object.keys(D.dogs).filter(k=>{const d=D.dogs[k];return d.sex==="F"&&!d.ext&&(d.status==="fattrice"||d.fattr)&&d.status!=="sterilizzata"&&d.status!=="deceduto"}).sort((a,b)=>dn(a).localeCompare(dn(b)))}
function dogAge(d){const y=d.birth?new Date(d.birth):d.year?new Date(d.year+"-06-01"):null;return y?(Date.now()-y)/3.156e10:null}
function mateMales(){return Object.keys(D.dogs).filter(k=>{const d=D.dogs[k],a=dogAge(d);return d.sex==="M"&&d.status!=="deceduto"&&(d.sbtAdded||(a!==null&&a>=1&&a<=12))}).sort((a,b)=>dn(a).localeCompare(dn(b)))}
// COI della coppia: SBT se c'è (analisi della cucciolata o valore inserito), altrimenti Wright solo se affidabile
function pairCoi(s,d){const l=Object.values(D.litters).find(x=>x.sire===s&&x.dam===d&&x.sbtA&&x.sbtA.c8);if(l)return{v:pc(l.sbtA.c8),src:"sbt"};
  const m=mateSbt(s,d);if(!isNaN(m))return{v:m,src:"sbt"};const cv=coverage(s,d),r=cv.tot?cv.known/cv.tot:0;return{v:coi8(s,d)*100,src:r>=.7?"wright":"low",cov:Math.round(r*100)}}
function mating(){const F=mateFemales();if(!F.includes(mateD))mateD=F[0]||null;const M=mateMales();
  const lab=k=>{const d=D.dogs[k];let t=`${d.name}${d.nick?" (“"+d.nick+"”)":""}${d.birth||d.year?" · "+String(d.birth||d.year).slice(0,4):""}`;if(!mateD)return t;
    const p=pairCoi(k,mateD),ic=p.src==="low"?"⚪":p.v<6?"🔵":p.v<=9?"🟢":"🔴";return `${ic} ${t} — ${p.src==="sbt"?"COI SBT "+pf(p.v)+"%":p.src==="wright"?"COI "+pf(p.v)+"%":"COI non affidabile"}`};
  const og=(t,ks)=>ks.length?`<optgroup label="${t}">${ks.map(k=>`<option value="${k}" ${k===mateS?"selected":""}>${esc(lab(k))}</option>`).join("")}</optgroup>`:"";
  return `<h1>Accoppiamenti</h1><p class="lead">Scegli la fattrice e il maschio. Accanto a ogni maschio c'è già il COI con la fattrice scelta: 🟢 nella tua fascia 6–9% · 🔵 sotto · 🔴 sopra · ⚪ non affidabile (pedigree incompleto).</p>
  <div class="pick"><label>Femmina<select id="md">${F.map(k=>`<option value="${k}" ${k===mateD?"selected":""}>${esc((D.dogs[k].nick?D.dogs[k].nick+" – ":"")+D.dogs[k].name)}</option>`).join("")}</select></label>
  <label>Maschio<select id="ms"><option value="">— scegli il maschio —</option>${og("I tuoi maschi",M.filter(k=>!D.dogs[k].ext))}${og("Stalloni in archivio",M.filter(k=>D.dogs[k].ext))}</select></label></div>
  <div class="addsbt"><b>➕ Aggiungi un maschio da SBTpedigree</b><p class="row-meta" style="margin:4px 0 0">Incolla il link della sua pagina su SBT: provo a leggere nome, nascita e genitori. Se SBT non lo lascia leggere, ti chiedo solo il nome.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><input id="sbtUrl" placeholder="https://sbtpedigree.com/dog_details?dogs_id=…" style="flex:1;min-width:220px"><button class="btn small" data-a="sbtAdd">Aggiungi</button></div></div>
  <div id="mateOut"></div>`}
function gensOf(root,x,depth=7){const g=[];if(root===x)g.push(1);ancestors(root,depth).forEach((c,i)=>c.forEach(y=>{if(y===x)g.push(i+2)}));return g}
function ancList(com,S=mateS,M=mateD){if(!com.length)return '<p class="row-meta">Nessun antenato in comune fra quelli inseriti.</p>';
  const ord=n=>n+"ª";
  const items=com.map(x=>{const a=gensOf(S,x),b=gensOf(M,x);return{x,a,b,n:a.length+b.length,min:Math.min(...a,...b)}})
    .sort((p,q)=>q.n-p.n||p.min-q.min||dn(p.x).localeCompare(dn(q.x)));
  return `<h3 class="anc-h">Antenati in comune <span>${items.length}</span></h3><p class="row-meta" style="margin:0 0 8px">Generazioni contate dai cuccioli: 1ª = genitori, 2ª = nonni, 3ª = bisnonni…</p>
  <div class="anc-list">${items.map(({x,a,b,n})=>{const d=D.dogs[x];
    return `<div class="anc-row">${thumb(d)}<div class="anc-t"><button class="plink anc-n" data-a="open" data-v="${x}">${esc(d.name)}</button>
    <span class="row-meta">Lato padre: ${a.map(ord).join(", ")} gen. · Lato madre: ${b.map(ord).join(", ")} gen.</span></div>
    <div class="anc-r"><span class="anc-c" title="Volte nel pedigree">${n}×</span>${d.sbt?`<a href="https://sbtpedigree.com/dog_details?dogs_id=${encodeURIComponent(d.sbt)}" target="_blank" rel="noopener">SBT ↗</a>`:""}</div></div>`}).join("")}</div>`}
const pc=v=>v?parseFloat(String(v).replace(",",".")):NaN;
const pf=n=>n.toFixed(2).replace(".",",");
function mateSbt(s,d){const m=D.matings&&D.matings[s+"|"+d];return m&&m.coiSbt?pc(m.coiSbt):NaN}
function setMateSbt(v){D.matings=D.matings||{};const k=mateS+"|"+mateD;const t=v.trim().replace("%","");
  if(t&&isNaN(pc(t)))return;D.matings[k]=Object.assign(D.matings[k]||{},{coiSbt:t});calcMate()}
function calcMate(){
  const o=$("#mateOut");if(!o)return;
  if(!mateS||!mateD||!D.dogs[mateS]||!D.dogs[mateD]){o.innerHTML='<p class="empty">Scegli la femmina e il maschio.</p>';return}
  const p=pairCoi(mateS,mateD),w=coi8(mateS,mateD)*100,cov=coverage(mateS,mateD),b=p.src==="low"?["Pedigree incompleto: COI poco affidabile",""]:band(p.v),m=(D.matings||{})[mateS+"|"+mateD]||{};
  const lit=Object.entries(D.litters).find(([,l])=>l.sire===mateS&&l.dam===mateD),ds=D.dogs[mateS],dd=D.dogs[mateD];
  const miss=[mateS,mateD].map(k=>{const c=pedCount(k);return c.k<c.t*.9?`<button class="btn ghost small" data-a="pedForm" data-v="${k}">Completa il pedigree di ${esc(dn(k).split(" ")[0])} (${c.k}/${c.t})</button>`:""}).join("");
  o.innerHTML=`<div class="res"><p class="row-meta" style="margin:0">Coppia${lit?" · 🐾 già "+(lit[1].state==="pianificata"?"pianificata":"fatta"):""}</p><h2 style="margin:2px 0 8px">${esc(dd.nick||dd.name)} × ${esc(ds.name)}</h2>
   <div style="display:flex;gap:14px;align-items:baseline;flex-wrap:wrap"><span class="cnum">${pf(p.v)}<small>%</small></span><span class="badge ${b[1]}">${b[0]}</span>
   <span class="row-meta">${p.src==="sbt"?"COI SBT 8 generazioni":`COI del gestionale (Wright, 8 gen.) · antenati inseriti ${cov.known} di ${cov.tot}`}</span></div>
   ${p.src==="sbt"?`<p class="row-meta" style="margin:6px 0 0">Calcolo del gestionale: ${pf(w)}% · antenati inseriti ${cov.known} di ${cov.tot}</p>`:""}
   <p class="row-meta" style="margin:8px 0 0"><label class="sbt-in">COI SBT del test mating: <input id="mateSbt" inputmode="decimal" placeholder="es. 6,17" value="${esc(m.coiSbt||"")}">%</label></p>
   <div class="twrap"><div class="tcard"><b>Su chi cade la consanguineità</b>${ancWeight(mateS,mateD)}</div>
   <div class="tcard"><b>🧪 Test genetici</b><p style="margin:6px 0 0"><b>${esc(dd.nick||dd.name)}:</b> ${esc(dd.tests||"non inseriti")}</p><p style="margin:6px 0 0"><b>${esc(ds.name)}:</b> ${esc(ds.tests||"non inseriti")}</p></div></div>
   <div class="actions">${lit?`<button class="btn" data-a="litterSheet" data-v="${lit[0]}">Scheda della cucciolata</button>`:`<button class="btn" data-a="planLitter">🐾 Pianifica la cucciolata</button>`}
   ${ds.sbt?`<a class="btn ghost" href="https://sbtpedigree.com/dog_details?dogs_id=${encodeURIComponent(ds.sbt)}" target="_blank" rel="noopener">${esc(ds.name.split(" ")[0])} su SBT ↗</a>`:""}${miss}</div></div>`;
  roClean(o);
}
function loadDemo(){
  if(D.dogs.ex_cap){mateS="ex_x";mateD="ex_y";render();return}
  const add=(id,name,sex,sire,dam)=>D.dogs[id]={name:"Esempio · "+name,sex,sire,dam,ext:true};
  add("ex_cap","Capostipite","M");add("ex_m1","Madre 1","F");add("ex_m2","Madre 2","F");
  add("ex_a","Figlio A","M","ex_cap","ex_m1");add("ex_b","Figlia B","F","ex_cap","ex_m2");
  add("ex_x2","Femmina esterna","F");add("ex_y2","Maschio esterno","M");
  add("ex_x","Maschio X","M","ex_a","ex_x2");add("ex_y","Femmina Y","F","ex_y2","ex_b");
  mateS="ex_x";mateD="ex_y";render();
  setTimeout(()=>alert("Esempio caricato: X e Y sono figli di due mezzi fratelli (stesso padre). Prova anche Figlio A × Figlia B."),50);
}


/* ---------- Comandi (senza codice inline, funziona in ogni visualizzatore) ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el||el.disabled)return;
  const a=el.dataset.a,v=el.dataset.v||"";
  switch(a){
    case "close":closeSheet();break;
    case "ctSigReset":{if(D.settings)delete D.settings.sellerSig;render();typeof saveNow==="function"&&saveNow();break}
    case "ctGo":{const d=D.dogs[v],p=$("#ctPrice"),nw=padData("ctMe"),s=nw||ctSellerSig();if(!p||!p.value.trim()||!s)break;
      if(nw){D.settings=D.settings||{};D.settings.sellerSig=nw}
      d.contract=Object.assign(d.contract||{},{price:p.value.trim(),meSig:s,visible:true});render();typeof saveNow==="function"&&saveNow();toast("Mandato: ora lo trova nella sua pagina. Avvisalo su WhatsApp.");break}
    case "ctUndo":{const c=D.dogs[v].contract;c.visible=false;delete c.meSig;render();typeof saveNow==="function"&&saveNow();toast("Ritirato: correggi e firma di nuovo.");break}
    case "ctView":{const d=D.dogs[v],G=CONTR[v];sheet(`${ctHtml(G?G.snap:ctSnap(v),G?G.buyer:ctBuyer(v),G||null,G?G.meSig:(d.contract||{}).meSig)}<div class="actions"><button class="btn ghost" data-a="close">Chiudi</button></div>`);break}
    case "ctDl":{const G=CONTR[v];if(G)ctPdf(G.snap,G.buyer,G,G.meSig).then(p=>p.save(ctFile(G.snap))).catch(()=>toast("Non riesco a creare il PDF: controlla la connessione."));break}
    case "litterSheet":litterSheet(v);break;
    case "litSbt":{const u=($("#litSbt").value||"").trim();if(u&&!/^https?:\/\//i.test(u)){toast("Incolla un link che inizia con https://");break}const l=D.litters[v];if(u)l.sbtUrl=u;else delete l.sbtUrl;typeof saveNow==="function"&&saveNow();toast(u?"Link salvato: ora è nella pagina dei proprietari.":"Link tolto.");if(sheetOpen())litterSheet(v);else render();break}
    case "cancelDog":cancelSheet();break;
    case "pedDone":cancelSheet();break;
    case "pedForm":pedForm(v);break;
    case "back":if(NAVSTACK.length>1){history.back()}else{view=null;render()}break;
    case "open":closeSheet();openItem(v);break;
    case "openDog":tab="cani";openItem(v);break;
    case "openOwner":tab="proprietari";openItem(v);break;
    case "openLitterDog":tab="cani";openItem(v);break;
    case "go":go(v);break;
    case "filter":filter=v;render();break;
    case "dogForm":dogForm(v||undefined);break;
    case "saveDog":saveDog(v);break;
    case "ownerForm":ownerForm(v||undefined);break;
    case "saveOwner":saveOwner(v);break;
    case "ownerPreview":ownerPreview(v);break;
    case "ovLang":{const [i,l]=v.split("|");ownerPreview.lang=ownerPreview.lang||{};ownerPreview.lang[i]=l;ownerPreview(i);break}
    case "hForm":hForm(v);break;
    case "rpForm":rpForm(v);break;
    case "rpSave":rpSave(v);break;
    case "rpDel":{const [id,i]=v.split("|");if(!confirm("Eliminare questa voce?"))break;D.dogs[id].repro.splice(+i,1);render();typeof saveNow==="function"&&saveNow();break}
    case "hSave":hSave(v);break;
    case "qh":qh(v||"");break;
    case "qhK":QH.k=v;QH.target=$("#qht").value;qhRender();break;
    case "qhSave":qhSave();break;
    case "edf":edf(v);break;
    case "editOn":editOn(v);break;
    case "editSave":editSave(v);break;
    case "editCancel":EDIT=null;EDIRTY=false;render();toast("Modifiche annullate: nulla è stato cambiato.");break;
    case "ownEdit":EDIT="own:"+v;EDIRTY=false;render();setTimeout(()=>{const b=document.querySelector(".editbox");b&&b.scrollIntoView({block:"start",behavior:"smooth"})},50);break;
    case "ownSave":ownSave(v);break;
    case "edfSave":edfSave(v);break;
    case "docForm":docForm(v);break;
    case "docSave":docSave(v);break;
    case "docDel":docDel(v);break;
    case "hDel":hDel(v);break;
    case "litterForm":litterForm();break;
    case "saveLitter":saveLitter();break;
    case "loadDemo":loadDemo();break;
    case "rmPhoto":tmpPhoto="";$("#fphPrev").innerHTML='<span class="thumb ph" style="width:72px;height:72px;border-radius:8px">?</span>';break;
    case "mate":{const d=D.dogs[v];if(d.sex==="M")mateS=v;else mateD=v;tab="coi";view=null;render();break}
    case "planLitter":{const lid=newId("l");D.litters[lid]={dam:mateD,sire:mateS,date:null,state:"pianificata",notes:""};typeof saveNow==="function"&&saveNow();toast("Cucciolata pianificata: la trovi in Cucciolate.");calcMate();break}
    case "mateWith":{closeSheet();const [s1,d1]=v.split("|");mateS=s1;mateD=d1;tab="coi";view=null;render();break}
  }
});

/* ---------- Sheet ---------- */
function sheet(h){if(!sheetOpen()){try{history.pushState({tab,view,sheet:1},"")}catch(e){}}$("#sheet").innerHTML=h;colorize($("#sheet"));roClean($("#sheet"));$("#sheetBg").classList.add("open");const f=$("#sheet input,#sheet button");f&&f.focus()}
function closeSheetRaw(){$("#sheetBg").classList.remove("open")}
function closeSheet(){const was=sheetOpen();closeSheetRaw();if(was&&history.state&&history.state.sheet){try{history.replaceState({tab,view},"")}catch(e){}}}
$("#sheetBg").addEventListener("click",e=>{if(e.target.id==="sheetBg")cancelSheet()});
addEventListener("keydown",e=>{if(e.key==="Escape")cancelSheet()});

/* Contratto: il proprietario firma con il dito */
document.addEventListener("click",async e=>{const b=e.target.closest("[data-ct]");if(!b)return;const id=b.dataset.v,d=D.dogs[id],en=LANG==="en",T=(a,c)=>en?c:a;
  if(b.dataset.ct==="pdf"){b.disabled=true;try{const G=d.ctSigned;const p=await ctPdf(G.snap,G.buyer,G,d.contract.meSig);p.save(ctFile(G.snap))}catch(x){alert(T("Non riesco a creare il PDF: riprova.","Could not create the PDF: please try again."))}b.disabled=false;return}
  if(b.dataset.ct!=="sign")return;const err=document.getElementById("cterr_"+id),g=k=>document.getElementById("ctb_"+k).value.trim();
  const buyer={name:g("name"),cf:g("cf"),doc:g("doc"),via:g("via"),cap:g("cap"),tel:g("tel"),mail:g("mail")};
  const r=document.querySelector(`input[name="c36_${id}"]:checked`),s1=padData("ctB1_"+id),s2=padData("ctB2_"+id),ok=document.getElementById("ctok_"+id).checked;
  const miss=!buyer.name||!buyer.cf||!buyer.doc||!buyer.via||!buyer.cap?T("Completa nome, codice fiscale, documento e indirizzo.","Please fill in name, tax code, ID document and address."):
    !r?T("Scegli un'opzione per foto e nome.","Please choose an option for photos and name."):!s1||!s2?T("Servono tutte e due le firme.","Both signatures are needed."):!ok?T("Spunta la casella di conferma.","Please tick the confirmation box."):"";
  if(miss){err.textContent=miss;return}
  err.textContent="";b.disabled=true;b.textContent=T("Firma in corso…","Signing…");
  try{const tok=location.pathname.split("/").filter(Boolean).pop()||"";
    const res=await fetch("/api/public/"+encodeURIComponent(tok)+"/contract",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({dog:id,ver:CT_VER,buyer,c36:+r.value,sig1:s1,sig2:s2})});
    if(!res.ok){const x=await res.json().catch(()=>({}));throw new Error(x.error||res.status)}
    location.reload()}catch(x){err.textContent=T("La firma non è andata a buon fine: ","Signing failed: ")+x.message;b.disabled=false;b.textContent=T("Firma il contratto","Sign the agreement")}});

</script>
