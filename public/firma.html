<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Firma il documento</title>
<!-- Firma a distanza di un documento dell'Anagrafe (20/10/2026, anteprima approvata da Paolo).
     Si apre con /p/firma/<link segreto>. Mostra la pagina del PDF con i punti gialli "FIRMA QUI"; chi firma disegna la firma
     una volta e il PDF firmato (pdf-lib, firma in tutti i punti) va al gestionale (POST /api/public/firma/<link>). -->
<style>
:root{--bg:#ECEEF1;--paper:#FFFFFF;--ink:#1C2230;--muted:#5C6472;--line:#D6DAE0;--accent:#8C2B23;--ok:#2F6B3F;--ok-soft:#E1EEE4;--warn:#9A5B12;--warn-soft:#F6EAD8;
  --serif:"Young Serif",Georgia,"Times New Roman",serif;--sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px}
h1{font-family:var(--serif);font-weight:400;font-size:1.3rem;margin:0 0 4px}
.meta{color:var(--muted);font-size:.9rem;margin:0 0 12px}
.doc{position:relative;width:100%;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;min-height:120px}
.doc canvas{display:block;width:100%;height:auto}
.spot{position:absolute;border:2px dashed #c0392b;background:rgba(255,230,120,.45);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:700;color:var(--accent)}
.spot.done{border:0;background:transparent}.spot img{max-width:100%;max-height:130%;object-fit:contain}
.lbl{font-size:.88rem;color:var(--muted);margin:14px 0 4px}
.pad{width:100%;height:180px;border:2px solid var(--ink);border-radius:10px;background:#fff;touch-action:none;display:block}
.btn{border:0;background:var(--ink);color:#fff;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.small{padding:6px 12px;font-size:.9rem}
.btn.big{width:100%;padding:14px;font-size:1.05rem;margin-top:12px}.btn:disabled{opacity:.45}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:.93rem;margin-top:12px;cursor:pointer}.ck input{width:22px;height:22px;flex:none;margin-top:1px}
.st{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;font-size:.95rem;margin:12px 0 0}
.st.ok{background:var(--ok-soft);color:var(--ok)}.st.todo{background:var(--warn-soft);color:var(--warn)}
.wait{color:var(--muted);text-align:center;padding:30px 0}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="app"><p class="wait">⏳ Apro il documento…</p></div></div>
<script>
const TOK=(location.pathname.split("/").filter(Boolean).pop()||"").replace(/[^A-Za-z0-9_-]/g,""),API="/api/public/firma/"+TOK;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||"");return m?m[3]+"/"+m[2]+"/"+m[1]:""};
const loadJs=src=>new Promise((ok,ko)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>ko(new Error(src));document.head.appendChild(s)});
let INFO=null,PDFBUF=null,SIG=null;
/* «firmo l'attestato…» / «firmo il documento…»: articolo davanti al titolo scritto minuscolo */
const art=t=>{t=String(t||"documento");t=t.charAt(0).toLowerCase()+t.slice(1);return(/^[aeiouàèéìòù]/i.test(t)?"l'":/^(s[^aeiou]|z|gn|ps|x|y)/i.test(t)?"lo ":"il ")+t};
function fail(m){$("#app").innerHTML=`<h1>✍️ Firma</h1><div class="st todo">⚠️ <span>${esc(m)}</span></div>`}
function doneHtml(at){return `<div class="st ok">✓ <span><b>Firmato, grazie!</b><br><small>Il documento firmato${at?" il "+fmt(at):""} è già arrivato a Paolo.</small></span></div>
  <a class="btn ghost big" href="${API}/signed" target="_blank" rel="noopener">⬇️ Scarica il PDF firmato</a>`}
async function start(){
  try{const r=await fetch(API,{cache:"no-store"});if(!r.ok)return fail("Questo link non è valido. Chiedi a Paolo di mandartelo di nuovo.");INFO=await r.json()}catch(e){return fail("Non riesco a collegarmi. Controlla la connessione e riprova.")}
  const I=INFO;
  if(I.signed){$("#app").innerHTML=`<h1>✍️ ${esc(I.title)}</h1><p class="meta">${esc(I.dog)}</p>`+doneHtml(I.signed);return}
  if(!I.ready)return fail("Il documento non è ancora pronto. Riprova tra qualche minuto.");
  const first=String(I.holder||"").split(" ")[0];
  $("#app").innerHTML=`<h1>✍️ Firma l'attestato di ${esc(I.dog)}</h1>
  <p class="meta">${first?esc(first)+", firma":"Firma"} col dito dal telefono, col mouse dal computer, nel riquadro qui sotto: la firma va da sola nei ${I.spots.length} punti gialli del documento.</p>
  <div class="doc" id="doc"><p class="wait">⏳ Apro il documento…</p></div>
  <div class="lbl">La tua firma:</div><canvas class="pad" id="pad"></canvas>
  <div style="margin-top:6px"><button class="btn small ghost" id="clr">↺ Cancella e rifai</button></div>
  <label class="ck"><input type="checkbox" id="ok"><span>Sono ${esc(I.holder)} e firmo ${esc(art(I.title))} di ${esc(I.dog)}${I.pedName&&I.pedName!==I.dog?" ("+esc(I.pedName)+")":""}.</span></label>
  <button class="btn big" id="sign" disabled>✍️ Firma</button><div id="out"></div>`;
  padInit();
  try{const r=await fetch(API+"/pdf",{cache:"no-store"});if(!r.ok)throw 0;PDFBUF=await r.arrayBuffer();await showPage()}
  catch(e){$("#doc").innerHTML='<p class="wait">Non riesco a mostrare il documento. Puoi firmare lo stesso.</p>'}}
async function showPage(){
  await loadJs("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");const P=window.pdfjsLib;
  P.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf=await P.getDocument({data:PDFBUF.slice(0)}).promise,pg=await pdf.getPage(1),v1=pg.getViewport({scale:1}),sc=Math.min(3,1400/v1.width),vp=pg.getViewport({scale:sc});
  const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
  const D=$("#doc");D.innerHTML="";D.appendChild(c);
  INFO.spots.filter(s=>(s.p||0)===0).forEach(s=>{const e=document.createElement("div");e.className="spot";Object.assign(e.style,{left:s.l*100+"%",top:s.t*100+"%",width:s.w*100+"%",height:s.h*100+"%"});e.textContent="FIRMA QUI";D.appendChild(e)})}
/* riquadro della firma */
let pc,px,drawing=false,has=false;
function padInit(){pc=$("#pad");px=pc.getContext("2d");const fit=()=>{const r=pc.getBoundingClientRect();pc.width=r.width*2;pc.height=r.height*2;px.setTransform(2,0,0,2,0,0);px.lineWidth=2.6;px.lineCap="round";px.lineJoin="round";px.strokeStyle="#0b2a6f";has=false;upd()};fit();
  const pos=e=>{const r=pc.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  pc.onpointerdown=e=>{drawing=true;pc.setPointerCapture(e.pointerId);const[a,b]=pos(e);px.beginPath();px.moveTo(a,b);px.lineTo(a+.1,b+.1);px.stroke()};
  pc.onpointermove=e=>{if(!drawing)return;const[a,b]=pos(e);px.lineTo(a,b);px.stroke();has=true;upd()};
  pc.onpointerup=pc.onpointercancel=()=>{drawing=false};
  $("#clr").onclick=()=>{px.clearRect(0,0,pc.width,pc.height);has=false;upd()};$("#ok").onchange=upd;$("#sign").onclick=sign}
function upd(){$("#sign").disabled=!(has&&$("#ok").checked)}
function cropSig(){const W=pc.width,H=pc.height,d=px.getImageData(0,0,W,H).data;let a=W,b=H,e=0,f=0;
  for(let j=0;j<H;j++)for(let i=0;i<W;i++)if(d[(j*W+i)*4+3]){if(i<a)a=i;if(i>e)e=i;if(j<b)b=j;if(j>f)f=j}
  if(e<=a||f<=b)return null;const o=document.createElement("canvas");o.width=e-a+12;o.height=f-b+12;o.getContext("2d").drawImage(pc,a-6,b-6,o.width,o.height,0,0,o.width,o.height);return o}
/* la firma in ogni punto, anche sulle pagine ruotate (provato con rotazione 0/90/180/270) */
async function stamp(sigPng,sw,sh){let L=window.PDFLib;if(!L){try{await loadJs(API+"/lib")}catch(e){await loadJs("https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js")}L=window.PDFLib}
  const doc=await L.PDFDocument.load(PDFBUF,{ignoreEncryption:true}),img=await doc.embedPng(sigPng);
  for(const s of INFO.spots){const p=doc.getPage(s.p||0),{width:W,height:H}=p.getSize(),r=((p.getRotation().angle%360)+360)%360,dw=r%180?H:W,dh=r%180?W:H;
    const bw=s.w*dw,bh=s.h*dh*1.3,k=Math.min(bw/sw,bh/sh),w=sw*k,h=sh*k;
    const X=s.l*dw+(bw-w)/2,Y=(1-s.t-s.h)*dh-s.h*dh*.15;   /* in basso nel riquadro, appoggiata alla riga */
    const o=r===0?{x:X,y:Y}:r===90?{x:W-Y,y:X}:r===180?{x:W-X,y:H-Y}:{x:Y,y:H-X};
    p.drawImage(img,{x:o.x,y:o.y,width:w,height:h,rotate:L.degrees(r)})}
  return doc.save()}
async function sign(){const b=$("#sign");if(!PDFBUF){alert("Il documento non si è aperto: ricarica la pagina e riprova.");return}
  const c=cropSig();if(!c)return;b.disabled=true;b.textContent="⏳ Firmo…";
  try{const png=c.toDataURL("image/png"),bytes=await stamp(png,c.width,c.height);
    let bin="";for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
    const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({sig:png,pdf:btoa(bin)})}),j=await r.json().catch(()=>({}));
    if(!r.ok&&r.status!==409)throw new Error(j.error||"errore "+r.status);
    document.querySelectorAll(".spot").forEach(s=>{s.classList.add("done");s.innerHTML='<img alt="firma" src="'+png+'">'});
    ["#pad","#clr",".lbl",".ck","#sign"].forEach(q=>{const e=$(q);if(e)e.style.display="none"});$(".meta").style.display="none";
    $("#out").innerHTML=doneHtml(j.at);$("#doc").scrollIntoView({behavior:"smooth"})}
  catch(e){b.disabled=false;b.textContent="✍️ Firma";alert("La firma non è partita: controlla la connessione e riprova.\n\n"+e.message)}}
start();
</script>
</body>
</html>
